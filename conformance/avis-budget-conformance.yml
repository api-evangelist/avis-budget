domain_standards:
  note: >-
    Car rental has no regulatory regime in scoring.yml; these are reward-only observations of standards the
    CONTRACT itself declares, with the exact location in the spec.
  standards:
    - id: acriss-sipp-vehicle-codes
      conforms: true
      evidence: >-
        GET /cars/catalog/v2/vehicles declares query parameter `sipp_codes` ("comma-separated sipp_codes used for
        vehicle filtering ... a compact 4 door manual air conditioned car will have a SIPP Code CMDR") and every
        vehicle in availability/rate/reservation responses carries category.sipp_code (e.g. MBMR). SIPP is the
        ACRISS industry car-classification code — the interline vehicle standard a travel integrator already speaks.
      spec_location: paths./cars/catalog/v2/vehicles.get.parameters[name=sipp_codes]; components.schemas.*.category.sipp_code
    - id: iata-agency-number
      conforms: true
      evidence: >-
        Rate and reservation requests accept an IATA/ARC agency number (21 mentions; e.g. business code 1112 "This
        coupon requires an IATA / ARC number") and paperless-voucher billing is enabled per IATA number.
      spec_location: paths./cars/catalog/v2/vehicles/rates.post.requestBody + paths./cars/reservation/v2.post.requestBody (iata_number)
    - id: iso-3166-country-codes
      conforms: true
      evidence: country_code parameters documented as ISO 3166 (9 mentions) on location search, terms and reservation requests.
    - id: iso-8601-datetimes
      conforms: true
      evidence: pickup_date / dropoff_date / request_time documented as ISO 8601 date-time (12 mentions).
    - id: opentravel-ota
      conforms: false
      evidence: No OTA_VehAvailRate / OTA_VehRes message shapes; the contract is a bespoke JSON design, not OpenTravel XML.
