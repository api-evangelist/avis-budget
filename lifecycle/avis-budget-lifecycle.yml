versioning:
  scheme: path-segment major version (v2) with a prescribed vMajor.Minor.Patch policy
  current: v2 (portal info.version 2.0.0)
  notes: >-
    The API Design Guide prescribes: first live major "v1", minor releases "v1.1", patches "v1.x.1"; additive-only
    changes are minor, anything breaking (required request field, removal/rename, type change, URL change,
    visible behaviour change) is a new major. Major versioning is gated on "value to customer must exceed
    existing version", cost-benefit, customer impact and a communication/support plan. The live contract shows
    only the major segment in paths; the Getting Started cURL still references /cars/locations/v1/, which the
    v2 contract no longer lists.
  docs: https://developer.avis.com/guides#version-scheme
lifecycle_states:
