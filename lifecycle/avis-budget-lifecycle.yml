  states:
    - name: Designed
      description: API design is complete. Scheduled for development.
      availability: 'No; mock service should be enabled.'
    - name: Beta
      description: Operational, available to select customers for testing.
      availability: Select customers only.
    - name: Live
      description: Operational, fully-supported in staging and production.
      availability: New and existing customers.
    - name: Deprecated
      description: Available to existing customers only. Fully supported.
      availability: Existing customers only.
    - name: Retired
      description: Unpublished. No longer available at runtime.
      availability: 'No.'
deprecation:
  policy_documented: true
  policy_url: https://developer.avis.com/guides#api-product-lifecycle
  policy_summary: >-
    A deprecated API stays available and fully supported for existing customers (closed to new customers) until
    it is retired and unpublished. No notice period, no sunset timeline and no RFC 8594 Deprecation/Sunset
    header are stated — the policy names the states, not the clock.
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  notes: >-
    No operation in the 9-operation OpenAPI carries `deprecated: true`. A Deprecation pointer is emitted for the
    published state policy; it is a weak policy (states without durations) and is recorded as such.
