            $ref: '#/components/schemas/error'
    vehicle_status:
      title: Vehicle Status
      description: Vehicle Status Information.
      enum:
      - OnRequest
      - Available
      type: string
      example: Available
    insurance_code:
      title: Insurance Code
      description: 3-character code of the insurance coverage.
      enum:
      - ALI
      - CDW
      - LDW
      - PAI
      - LI
      - PEP
      - SCDW
      - SPAI
      - STP
      - TP
      - PKG
      type: string
      example: CDW
    discount_code:
      title: Discount Code
      description: The rental vehicle brand discount code. This field can be an Avis Worldwide Discount (AWD), Budget Car Discount (BCD), or a Payless Discount Number (PDN) code.
      type: string
      example: R566100
    availability_special_fields:
      title: Special Fields
      description: Additional information for the rental vehicle reservation.
      type: object
      properties:
        cost_control:
          description: Also known as CCI. This field is used to store cost control information from a travel order, purchase order number or company reference.
          type: string
        company_name:
          description: Name of renter’s company or employer.
          type: string
        remark:
          description: This field is used to indicate additional information or special requests applicable to the rental.
          maxLength: 25
          type: string
        member_code:
          description: Partner's member code.
          maxLength: 20
          type: string
    distance:
      title: Reservation Distance Limitations
      description: Information about rental vehicle reservation distance options and limitations. If a reservation includes limited distance, then the distance covered is returned in distance_covered and the rate if the distance is exceeded is returned in distance_overage.
      required:
      - unlimited_distance
      - distance_unit
      type: object
      properties:
        unlimited_distance:
          description: Indicates whether the reservation distance is unlimited.
          type: boolean
          example: true
        distance_covered:
          description: The free distance covered for the duration of the rental period.
          type: number
          example: 500
        distance_unit:
          description: The unit of distance.
          type: string
          example: miles
        distance_overage:
          description: The cost per distance unit if the free distance in distance_covered is exceeded.
          type: number
          example: 0.15
    central_billing_membership:
      title: Brand Membership
      description: Central billing account profile identification information.
      type: object
      properties:
        code:
          description: Corporate membership code for central billing account profile.
          type: string
          example: M21R322
    brand:
      title: Brand
      description: ABG supported brand names like Avis, Budget, or Payless
      enum:
      - Avis
      - Budget
      - Payless
      type: string
      example: Avis
    rate_totals_request:
      title: Rate Totals Request
      description: The fees, rates, and discounts applied to the reservation, with a breakdown of the reservation total.
      required:
      - rate
      type: object
      properties:
        requested_rate_currency:
          $ref: '#/components/schemas/requested_rate_currency'
        rate:
          $ref: '#/components/schemas/availability_rate_request'
        totals:
          $ref: '#/components/schemas/totals'
    coupon:
      title: Coupon Codes
      description: A promotional coupon that can be applied to a reservation for discounts, upgrades, free days, or other promotional offers.
      required:
      - code
      type: object
      properties:
        code:
          description: The coupon code to be applied to the reservation rate.
          type: string
          example: MUZZ014
        type:
          $ref: '#/components/schemas/coupon_type'
        quantity:
          title: Quantity
          description: The number of coupon codes to apply to the reservation.
          type: number
          example: 1
        coupon_applied:
          title: Coupon Applied Flag
          description: Indicates that a coupon code is valid and was successfully applied for the reservation.
          type: boolean
          example: false
        coupon_amount:
          description: The amount of the coupon discount applied to the cost of the reservation.
          type: number
          example: 0
        secondary_coupon_amount:
          description: The secondary amount of the coupon discount applied to the cost of the reservation.
          type: number
          example: 0
        coupon_extras:
          $ref: '#/components/schemas/extras'
        description:
          description: Description of the coupon code that was specified in the request.
          type: string
      example:
        code: some text
        type: Upgrade
        quantity: 13.21
        coupon_applied: true
        coupon_amount: 90.01
        coupon_extras:
        - - type: Upgrade
            code: XMR
            quantity: 24.64
            amount: 6.1
            total_owed: 68.22
          - type: DaysOff
            code: BBS
            quantity: 10.33
            amount: 12.95
            total_owed: 46.59
        - - type: DaysOff
            code: ADR
            quantity: 17.09
            amount: 38.26
            total_owed: 98.75
          - type: Upgrade
            code: SNW
            quantity: 24.2
            amount: 53.96
            total_owed: 3.34
        description: some text
    pickup_location:
      title: Pickup Location
      description: Rental car pickup location and address information.
      required:
      - address
      type: object
      properties:
        location:
          $ref: '#/components/schemas/location'
        address:
          $ref: '#/components/schemas/address'
    product_type:
      title: Product Type
      description: The type of ancillary product specified in the request. If a code of child safety seat (CSS) is specified in the request, then a value of SPEC_EQUIP will be returned in the response.
      enum:
      - COUNTER_PROD
      - SPEC_EQUIP
      - UPSELL
      type: string
      example: COUNTER_PROD
    rental_experience:
      title: Rentalexperience
      description: Defines the rental experience type and associated details.
      required:
      - type
      type: object
      properties:
        type:
          description: Indicates the type of rental experience. Controlled vocabulary for consistency across APIs.
          type: string
          example: AvisFirst
        benefits:
          description: Collection of benefits and premium services included with the rental experience.
          type: array
          items:
            type: string
          example:
          - Curbside vehicle delivery by a personal concierge.
          - 2025 model year vehicles with low mileage.
          - Chat with your personal concierge for any in-trip issues.
          - Skip the pump — pay only for fuel used, at market price.
          - Curbside drop-off with your concierge.
        code:
          description: Avis First location code, returned only when type = AvisFirst. Matches vendor location code format
          type: string
    discount:
      title: Brand Discounts
      description: The rental vehicle brand rewards program code (also known as discount code) to be applied to the rate of the reservation.
      type: object
      properties:
        code:
          $ref: '#/components/schemas/discount_code'
      example: R566100
    quote_id:
      title: Quote Identifier
      description: A unique identifier representing a specific rate quote. This ID is required for re-shop and booking requests to retain the originally quoted rate.
      type: string
      example: abc123xyz-456def789-ghijk012
    availability_customer:
      title: Availability Customer
      description: Information about the rental car customer. Only one customer can be specified in the request.
      properties:
        contact:
          $ref: '#/components/schemas/availability_contact'
        driver:
          $ref: '#/components/schemas/driver'
        address:
          $ref: '#/components/schemas/address'
    transmission:
      title: Vehicle Transmission
      description: The transmission of the vehicle.
      enum:
      - Automatic
      - Manual
      type: string
      example: Automatic
    vehicle_capacity:
      title: Vehicle Capacity
      description: Rental vehicle passenger seat and luggage capacity information.
      type: object
      properties:
        doors:
          description: The number of vehicle doors.
          type: string
          example: '4'
        seats:
          description: The number of passenger seats in the rental vehicle.
          type: string
          example: '5'
        mpg:
          description: Miles per gallon (MPG) of the vehicle.
          type: string
          example: 27/35
        luggage_capacity:
          $ref: '#/components/schemas/luggage_capacity'
        fuel_type:
          $ref: '#/components/schemas/fuel_type'
    rate_guarantee_blob:
      title: Rate Guarantee Binary Large Object
      description: A Rate Guarantee blob that represents the guaranteed rate associated with the booking.
      type: string
      example: Y| 365        B             DFW12004020900DFW1200403090012004011204  75 1501050                         150  75                7351    9800   68600  294000    9800                                            7351        2A  GA    1                NNNNNNNNNYNNNNNNNYNYNNNNNNNNNNNNYYYNNNNNNNNNNNNN 130                  30NNNNNNNN        NNNNNNNNNNNNNNNN    NNNNNNNNUSD  12   000NYNNNNNN
    disclaimer:
      title: Disclaimer
      description: This contains the addtional information
      required:
      - description
      type: object
      properties:
        type:
          title: Disclaimer Name
          description: Disclaimer name
          type: string
        description:
          title: Disclaimer Comment
          description: Disclaimer comment
          type: string
    availability_contact:
      title: Availability Contact
      description: The personal and contact information of the user you would like to associate to the user profile. If you would like to create a basic profile, you can provide the minimal contact information along with an indication of the desired brand. If you would like to create a preferred profile, you are required to provide many more parameters including driver license, payment information, and an election of several required options. If you do not provide this additional information, you will be unable to create a preferred profile.
      type: object
      properties:
        title:
          description: Title of the user.
          type: string
        first_name:
          description: First name of the user.
          type: string
        last_name:
          description: Last name of the user.
          type: string
        email:
          description: Email address of the user.
          type: string
        telephone:
          description: Telephone number of the user.
          type: string
        age:
          description: Driver’s age. This might influence the rates. Will be superseded by date of birth found in the profile provided in “membership_code”.
          type: number
        date_of_birth:
          format: date
          title: Date of Birth
          description: Driver’s date of birth. This might influence the rates. Will be superseded by “age” parameter or date of birth found in the profile provided in “membership_code”.
          type: string
          example: '1991-12-31'
    availability_confirmation:
      title: Availability Confirmation
      description: Basic confirmation details for the rental vehicle reservation.
      required:
      - number
      type: object
      properties:
        number:
          description: The confirmation number of the reservation.
          type: string
          example: 09369988GB2
        pickup_date:
          description: ISO 8601 date and time of pickup.
          type: string
          example: '2017-11-15T18:00:00'
        dropoff_date:
          description: ISO 8601 date and time of dropoff.
          type: string
          example: '2017-11-17T18:00:00'
    luggage_capacity:
      title: Luggage Capacity
      type: object
      properties:
        large_suitcase:
          description: The number of large suitcases that can be accommodated in the rental vehicle.
          type: string
        small_suitcase:
          description: The number of small suitcases that can be accommodated in the rental vehicle.
          type: string
    car_availability_rate_request:
      title: Rate Request
      description: The following demonstrates an example of a successful request for this endpoint.
      required:
      - rate_totals
      - product
      - reservation
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/transaction'
        product:
          $ref: '#/components/schemas/product'
        reservation:
          $ref: '#/components/schemas/reservation_rate_request'
        rate_totals:
          $ref: '#/components/schemas/rate_totals_request'
        extras:
          $ref: '#/components/schemas/extras'
        customer:
          $ref: '#/components/schemas/availability_customer'
        insurance:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/insurance'
      example:
        transaction:
          transaction_id: '12313'
        product:
          brand: Avis
        reservation:
          pickup_date: '2022-06-21T10:00:00'
          pickup_location: LHR
          dropoff_date: '2022-06-28T10:00:00'
          dropoff_location: LHR
          vehicle_sipp_code: MBMR
        rate_totals:
          rate:
            country_code: GB
            rate_code: IC
            discount:
              code: R566100
            membership:
              code: B0876Z
            coupon:
              code: MUZZ014
        insurance:
        - code: CDW
        extras:
        - code: GPS
          quantity: 1
    availability_vehicle_category:
      title: Availability Vehicle Category
      description: Identifying information and details about the rental vehicle.
      type: object
      properties:
        name:
          title: Name
          description: The name of the vehicle.
          type: string
          example: Volvo XC 60
        make:
          title: Make
          description: Make of the vehicle.
          type: string
          example: Volvo
        model:
          title: Make Model
          description: Model of the vehicle.
          type: string
          example: XC60
        sipp_code:
          $ref: '#/components/schemas/sipp_code'
        vehicle_status:
          $ref: '#/components/schemas/vehicle_status'
        vehicle_class_code:
          $ref: '#/components/schemas/vehicle_class_code'
        vehicle_class_name:
          title: Vehicle Class Name
          description: The name of the vehicle class.
          type: string
          example: Economy
        vehicle_transmission:
          $ref: '#/components/schemas/transmission'
        image_url:
          $ref: '#/components/schemas/url'
        small_image_url:
          $ref: '#/components/schemas/url'
    availability_rate_request:
      title: Availability Rate Request
      description: The reservation rate qualifiers that determine the rate of the reservation in the localized currency.
      required:
      - rate_code
      - country_code
      type: object
      properties:
        rate_code:
          $ref: '#/components/schemas/rate_code'
        currency:
          $ref: '#/components/schemas/currency'
        country_code:
          description: 2-character ISO 3166 customer country code.
          maxLength: 2
          minLength: 2
          type: string
        loyalty:
          $ref: '#/components/schemas/availability_loyalty'
        discount:
          $ref: '#/components/schemas/discount'
        membership:
          $ref: '#/components/schemas/availability_membership'
        coupon:
          $ref: '#/components/schemas/coupon'
        central_billing_membership:
          $ref: '#/components/schemas/central_billing_membership'
        quote_id:
          $ref: '#/components/schemas/quote_id'
        rate_guarantee_blob:
          $ref: '#/components/schemas/rate_guarantee_blob'
    driver:
      title: Driver License
      description: The driver license information of the user, including license number, issuing country, and date of birth.
      type: object
      properties:
        license_number:
          description: Driver license number.
          type: string
        state_code:
          description: 2-letter state code. For US country, valid combination of country and state code. For non-US country, XX is valid value.
          type: string
          example: TX
        country_code:
          description: 2-letter ISO 3166 country code.
          maxLength: 2
          minLength: 2
          type: string
          example: GB
        license_verified:
          description: Indicates the authenticity of the passenger's driving license.
          type: boolean
    coupon_type:
      title: Coupon Type
      description: The type of coupon that corresponds to the coupon code.
      enum:
      - MoneyOff
      - GasOff
      - DaysOff
      - Upgrade
      type: string
      example: Upgrade
    insurance:
      title: Rental Insurance Coverage
      description: The insurance coverage to be applied to the entirety of the reservation. Types of insurance includes Cover The Car (CDW), Cover My Liability (ALI), Cover Myself (PAI), and Cover My Belongings (PEP), Package (PKG). If insurance coverage is specified in the request, taxes are included in the total cost (in total_owed). Any preselected insurance coverage specified by a user within their wizard profile should be passed in the request. For example, if the user has selected Cover My Belongings (PEP) in their profile, then pass PEP.
      type: object
      properties:
        code:
          $ref: '#/components/schemas/insurance_code'
        name:
          $ref: '#/components/schemas/insurance_name'
        amount:
          description: The daily cost of the specified insurance coverage.
          type: number
        excess_amount:
          description: The insurance excess amount available as a part of the coverage.
          type: number
        currency:
          $ref: '#/components/schemas/currency'
        total_owed:
          description: Total owed of the specified insurance coverage for the entirety of the reservation.
          type: number
        secondary_amount:
          description: The daily cost of the specified insurance coverage.
          type: number
        secondary_excess_amount:
          description: The insurance excess amount available as a part of the coverage.
          type: number
        secondary_currency:
          $ref: '#/components/schemas/currency'
        secondary_total_owed:
          description: Total owed of the specified insurance coverage for the entirety of the reservation.
          type: number
        included_in_rate:
          description: Indicates whether price of Insurance product is included in reservation_total.
          type: boolean
          example: true
        selection_note:
          $ref: '#/components/schemas/insurance_selection_note'
        selected:
          description: Indicates whether insurance coverage has been selected by the user for the reservation. If the specified insurance coverage is accepted, a value of ACCEPTED will be returned in selection_note.
          type: boolean
          example: true
        tax_included:
          description: Indicates whether taxes are included in the cost (in total_owed).
          type: boolean
          example: true
    url:
      title: URL
      description: HTTP/HTTPS endpoint.
      pattern: ^https?://.*
      type: string
      example: https://www.avis.com/content/dam/cars/l/2017/ford/2017-ford-mustang-v6-coupe-black.png
    term:
      title: Term
      description: Term
      required:
      - method
      - endpoint
      - type
      type: object
      properties:
        type:
          description: Type
          enum:
          - location
          - rental
          - reservation
          type: string
        method:
          description: ''
          enum:
          - GET
          type: string
        endpoint:
          description: End Point to call to get the terms and condition. Host name will be chnaged based on environment
          type: string
          example: https://test.abgapiservices.com/terms/v2/location/avis/US/EWR/en_US
      example:
        type: reservation
        method: GET
        endpoint: https://test.abgapiservices.com/terms/v2/location/avis/US/EWR/en_US
    availability_rate_response:
