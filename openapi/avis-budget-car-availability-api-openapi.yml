    success_status:
      title: Success Status
      description: Success Status object
      required:
      - request_time
      - success
      type: object
      properties:
        request_time:
          format: date-time
          description: The time stamp of the request
          type: string
        success:
          description: Success Details
          type: array
          items:
            $ref: '#/components/schemas/success_detail'
    pay_total:
      title: Pay Total
      description: The total reservation rate, taxes and fees for the entirety of the reservation. This object is applicable only for Best Buy API.
      type: object
      properties:
        extras_total:
          description: Total cost of the specified ancillary products (such as GPS).
          type: number
        fees_total:
          description: Total cost of fees.
          type: number
        original_reservation_total:
          description: Original total cost of the reservation.
          type: number
        taxes_fees_total:
          description: Total cost of the combined taxes and fees for the reservation.
          type: number
        vehicle_total:
          description: Total cost of the rental vehicle.
          type: number
        taxes_total:
          description: Total cost of taxes.
          type: number
        reservation_total:
          description: Total cost of the reservation.
          type: number
        insurance_total:
          description: Total cost of the specified rental insurance coverage.
          type: number
          example: 7
        original_vehicle_total:
          description: Original total cost of the rental vehicle.
          type: number
        netvoucher_total:
          description: Total Net Voucher Amount
          type: number
        rate_code:
          $ref: '#/components/schemas/rate_code'
      additionalProperties: true
    rate_type:
      title: Rate Type
      description: The Rate type representing the Corporate vs Leisure rates
      enum:
      - CORPORATE
      - LEISURE
      type: string
    product:
      title: Product Brand
      description: The rental car product brand name information for the reservation.
      required:
      - brand
      type: object
      properties:
