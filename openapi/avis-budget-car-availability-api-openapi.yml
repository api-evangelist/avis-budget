components:
  schemas:
    rate_code:
      title: Vehicle Rate Code
      description: The rental vehicle rate code used to determine the rate of the rental vehicle reservation
      type: string
      example: G3
    availability_rate_totals_response:
      title: Availability Rate Totals
      description: The fees, rates, and discounts applied to the reservation, with a breakdown of the reservation total.
      required:
      - rate
      type: object
      properties:
        rate:
          $ref: '#/components/schemas/availability_rate_response'
        totals:
          $ref: '#/components/schemas/totals'
        pay_later:
          $ref: '#/components/schemas/pay_total'
        pay_now:
          $ref: '#/components/schemas/pay_total'
    tax:
      title: Tax
      description: Taxes applied to the reservation in the localized currency.
      type: object
      properties:
        type:
          description: The type of taxation to be applied.
          type: string
        amount:
          description: The cost of taxes for the reservation.
          type: number
        included_in_total:
          description: The flag to indicate whether the fees or charges are included in the Total Reservation cost.
          type: boolean
    transaction:
      title: Request Transaction
      description: In the instance a request has failed, transaction identifiers allow you to quickly identify the failed request. The following request transaction identifier may be used by your application to identify a request. We recommend that you use this identifier in every request.
      type: object
      properties:
        transaction_id:
          $ref: '#/components/schemas/transaction_id'
        system_id:
          title: Internal Correlation Identifier
          description: A unique identifier generated internally by the application to identify the payload and troubleshoot.
          type: string
          example: i9332ffa-5250-11e9-8647-d663bd873d78
      example:
        transaction_id: test56
    extras:
      title: Rental Extras
      description: The ancillary products, special equipment, and other extras selected as part of reservation.
      type: array
      items:
        $ref: '#/components/schemas/availability_extra'
    error:
      title: Error
      description: The following describes the elements that can appear in the response body of an error.
      required:
      - code
      - details
      - message
      - reason
      properties:
        code:
          description: The error code value
          type: string
        message:
          description: The HTTP status code message
          type: string
        reason:
          description: The reason the request has failed
          type: string
        details:
          description: Description of the error
          type: string
    currency:
      title: Currency
      description: Currency used for defining the amounts.
      type: string
      example: EUR
    iata_number:
      title: IATA Number
      description: International Air Transport Association (IATA) number. This is an identifier used by travel agents that allows the rental car company to pay the agent a commission for the rental.
      type: string
      example: '91212019'
    reservation_rate_request:
      title: Reservation Rate Request
      description: Reservation information for the rental vehicle reservation, including the pickup, dropoff, and vehicle class.
      required:
      - pickup_date
      - pickup_location
      - dropoff_location
      - dropoff_date
      - vehicle_sipp_code
      type: object
      properties:
        email_notification:
          description: Indicates the email notifications for create, modify and cancel can be sent or suppressed for a user.
          type: boolean
          example: true
        pickup_date:
          description: ISO 8601 date and time of pickup.
          type: string
          example: '2017-11-15T18:00:00.000Z'
        pickup_location:
          description: Rental car pickup location code.
          type: string
          example: EWR
        dropoff_date:
          description: ISO 8601 date and time of dropoff.
          type: string
          example: '2017-11-15T18:00:00.000Z'
        dropoff_location:
          description: Rental car dropoff location and address information.
          type: string
        confirmation:
          $ref: '#/components/schemas/availability_confirmation'
        special_fields:
          $ref: '#/components/schemas/availability_special_fields'
        vehicle_sipp_code:
          description: ''
          type: string
        vehicle_status:
          $ref: '#/components/schemas/vehicle_status'
        rental_experience:
          $ref: '#/components/schemas/rental_experience'
    availability_extra:
      title: Availability Extra
      description: The ancillary products, special equipment, and other extras selected as part of reservation.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/product_type'
        description:
          description: Product description. This field is supported in BB and Featured BB API.
          type: string
        code:
          $ref: '#/components/schemas/product_code'
        quantity:
          description: 'The number of ancillary products to add to the reservation. For example, if a value of 2 is specified for quantity, and a code of CSS, then two child safety seats will be added to the reservation.

            The products that allow multiple quantity is: ADD/ADR, CBS/CSS, CIS, GPS, SAT, XMR, WFI, TAB, RSN, ATP with a  maximum quantity of 3 each.  All other products are maximum of 1.'
          default: 1
          minimum: 0
          type: number
        amount:
          description: The price of the ancillary product.
          type: number
          example: 19.99
        currency:
          $ref: '#/components/schemas/currency'
        tax_amount:
          description: The tax of the ancillary product.
          type: number
        total_owed:
          description: The total price of the ancillary product for the entirety of the reservation period.
          type: number
          example: 19.99
        secondary_amount:
          description: The price of the ancillary product.
          type: number
          example: 19.99
        secondary_currency:
          $ref: '#/components/schemas/currency'
        secondary_tax_amount:
          description: The tax of the ancillary product.
          type: number
        secondary_total_owed:
          description: The total price of the ancillary product for the entirety of the reservation period.
          type: number
          example: 19.99
        included_in_rate:
          description: Indicates whether price of Extra product is included in reservation_total.
          type: boolean
          example: true
        max_allowed_quantity:
          description: This field is applicable only for BB and featured BB APIs. Refers to maximum counter products that are allowed per reservation.
          type: number
        pickup_type:
          description: Indicates whether the counter product should be picked at counter, installed on the device or no pick up required.
          enum:
          - NO_PICKUP_REQUIRED
          - COUNTER_PICKUP
          - INSTALLED_ON_VEHICLE
          type: string
        tax_included:
          description: Indicates whether taxes are included in the cost (in total_owed).
          type: boolean
    rate_request_response:
