openapi: 3.2.0
info:
  title: Avis Budget Car Availability API
  version: 2.0.0
  x-short-description: 'Combined ABG Rental Cars API package: vehicle availability & rates, reservations, location search, and terms & conditions.'
  description: 'Operations tagged Car Availability across 2 of this provider''s published API definitions: avis-budget-rental-cars-openapi.json, avis-budget-rental-cars-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://stage.abgapiservices.com
  description: Stage Environment
security:
- ABG-Access-Token: []
tags:
- name: Car Availability
  description: Car Availability API
paths:
  /cars/catalog/v2/vehicles:
    get:
      tags:
      - Car Availability
      parameters:
      - $ref: '#/components/parameters/brand'
      - name: pickup_date
        description: ISO 8601 date and time of pickup.
        schema:
          type: string
        in: query
        required: true
        x-example: '2022-06-21T10:00:00'
      - name: pickup_location
        description: Rental car pickup location code.
        schema:
          type: string
        in: query
        required: true
        x-example: LHR
      - name: age
        description: Driver’s age. This might influence the rates. Will be superseded by date of birth found in the profile provided in “membership_code”.
        schema:
          type: number
        in: query
        required: false
      - name: date_of_birth
        description: Driver’s date of birth. This might influence the rates. Will be superseded by “age” parameter or date of birth found in the profile provided in “membership_code”.
        schema:
          format: date
          type: string
        in: query
        required: false
        x-example: '1991-12-31T00:00:00.000Z'
      - name: membership_code
        description: The brand membership program code. This can be an Avis wizard number, Budget customer number, or Payless number.
        schema:
          type: string
        in: query
        required: false
      - name: dropoff_date
        description: ISO 8601 date and time of dropoff.
        schema:
          type: string
        in: query
        required: true
        x-example: '2022-06-28T10:00:00'
      - name: dropoff_location
        description: Rental car dropoff location code.
        schema:
          type: string
        in: query
        required: true
        x-example: LHR
      - name: country_code
        description: 2-character ISO 3166 customer country code.
        schema:
          maxLength: 2
          minLength: 2
          type: string
        in: query
        required: true
        x-example: GB
      - name: discount_code
        description: The rental vehicle brand discount code. This field can be an Avis Worldwide Discount (AWD), Budget Car Discount (BCD), or a Payless Discount Number (PDN) code.
        schema:
          type: string
        in: query
        required: false
        x-example: R566100
      - name: coupon_code
        description: The promotional coupon code number to be applied to the reservation rate.
        schema:
          type: string
        in: query
        required: false
        x-example: MUZZ014
      - name: iata_number
        description: International Air Transport Association (IATA) number. This is an identifier used by travel agents that allows the rental car company to pay the agent a commission for the rental.
        schema:
          type: string
        in: query
        required: false
        x-example: 0104724P
      - name: requested_rate_currency
        description: Specifies the ISO currency code in which the rate is fetched. This will be Secondary currency and rate currency will be the primary by default.
        schema:
          type: string
        in: query
        required: false
        x-example: USD
      - name: transaction_id
        description: In the instance a request has failed, transaction identifiers allow you to quickly identify the failed request. The following request transaction identifier may be used by your application to identify a request. We recommend that you use this identifier in every request.
        schema:
          type: string
        in: query
        required: false
        x-example: '23492034738'
      - $ref: '#/components/parameters/client_id'
      - name: partner_membership_code
        description: Customer's partner membership code associated with partner membership program.
        schema:
          type: string
        in: query
      - name: vehicle_sipp_codes
        description: This field contains comma-separated sipp_codes used for vehicle filtering. sipp code refers to Standard Interline Passenger Procedure (SIPP) code of the vehicle. A compact 4 door manual air conditioned car will have a SIPP Code CMDR.
        schema:
          type: string
        in: query
      - name: vehicle_class_codes
        description: This field contains comma-separated vehicle_class_codes used for vehicle filtering.
        schema:
          type: string
        in: query
      - name: inclusive
        description: Inclusive rate shop with coverages (Inclusive price)
        schema:
          type: boolean
        in: query
      - name: paperless
        description: Indicate that the car availability request is for retail paperless voucher to validate the location participates.
        schema:
          type: boolean
        in: query
      - name: central_billing_membership_code
        description: Corporate membership code for central billing account profile.
        schema:
          type: string
        in: query
      - name: rate_code
        description: The rental vehicle rate code used to determine the rate of the rental vehicle reservation
        schema:
          type: string
        in: query
      - name: rate_type
        description: The Rate type representing the Corporate vs Leisure rates
        schema:
          enum:
          - CORPORATE
          - LEISURE
          type: string
        in: query
        required: false
      - name: partner_membership_loyalty_level
        description: The partner membership loyalty level or status.
        schema:
          type: string
        in: query
      - name: last_name
        description: Last name of the user.
        schema:
          type: string
        in: query
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/best_buy_response'
              example:
                status:
                  request_time: '2022-03-04T11:06:46Z'
                  success:
