        bluetooth_equipped:
          description: Indicates that the rental vehicle is equipped with bluetooth connectivity.
          type: boolean
          example: true
        smoke_free:
          description: Indicates that the rental vehicle is a smoke-free vehicle.
          type: boolean
          example: true
        air_conditioned:
          description: Indicates that the rental vehicle is air conditioned.
          type: boolean
          example: true
        connected_car:
          description: Indicates that the rental vehicle is equipped with Connected Car technology (which generally includes Internet access and a wireless local area network).
          type: boolean
          example: true
    dropoff_location:
      title: Dropoff Location
