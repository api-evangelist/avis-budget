        discount:
          $ref: '#/components/schemas/discount'
        membership:
          $ref: '#/components/schemas/availability_membership'
        coupon:
          $ref: '#/components/schemas/coupon'
        currency:
          $ref: '#/components/schemas/currency'
        days:
