                    small_image_url: https://www.Avis.com/content/dam/cars/s/2015/fiat/2015-fiat-500-sport-hatchback-black.png
                  features:
                    air_conditioned: true
                  capacity:
                    doors: '3'
                    seats: '4'
                    luggage_capacity:
                      small_suitcase: '1'
                  rate_totals:
