      required:
      - pickup_location
      - dropoff_location
      - rate_totals
      type: object
      properties:
        distance:
          $ref: '#/components/schemas/distance'
        pickup_location:
          $ref: '#/components/schemas/pickup_location'
        dropoff_location:
          $ref: '#/components/schemas/dropoff_location'
        insurance:
          description: Rental Insurance Coverage
          type: array
          items:
            $ref: '#/components/schemas/insurance'
        extras:
          $ref: '#/components/schemas/extras'
        terms:
          description: Terms and Condition
          type: array
          items:
            $ref: '#/components/schemas/term'
        disclaimers:
          description: Disclaimers
          type: array
          items:
            $ref: '#/components/schemas/disclaimer'
        brand:
          $ref: '#/components/schemas/brand'
        rate_totals:
          $ref: '#/components/schemas/availability_rate_totals_response'
        secondary_rate_totals:
          $ref: '#/components/schemas/availability_rate_totals_response'
        rental_experience:
          $ref: '#/components/schemas/rental_experience'
    transaction_id:
      title: Transaction Identifier
      description: The transaction identifier used to identify and troubleshoot a given request.
      type: string
      example: 391117cf-4470-4353-8b51-f00c3c098943
    requested_rate_currency:
      title: Requested Rate Currency
      description: Requested rate currency for secondary rates. The Secondary currency is driven by the request or through
      type: string
      example: USD
    availability_loyalty:
      title: Availability Loyalty Program
      description: The Frequent Traveler Program (FTP) to be applied to the reservation. This entitles the user the opportunity to earn miles or points with ABG partners, such as airlines, hotels and other select companies. For example, the Lufthansa Miles & More Rewards Program. Surcharges may apply.
      type: object
      properties:
        company_id:
          description: The Frequent Traveler Program identifier of the airline, hotel, or other select company.
          type: string
          example: AD
        code:
          description: The unique Frequent Traveler Program (FTP) number of the traveler.
          type: string
          example: M21R322
      example:
