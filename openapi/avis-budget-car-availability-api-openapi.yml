                      currency: GBP
                      rate_code: 7I
                      coupon_applied: false
                      discount:
                        code: R566100
                    pay_later:
                      rate_code: 7I
                      vehicle_total: 220.28
                      reservation_total: 264.33
                    pay_now:
                      rate_code: 2X
                      vehicle_total: 200.26
                      reservation_total: 240.32
                reservation:
                  pickup_location:
                    location:
                      code: LHR
                      name: London Heathrow Airport T234
                      telephone: (44) 3445446000
                      airport_location: true
                    address:
                      address_line_1: Central Heathrow Loc
                      address_line_2: Northrop Rd
                      city: London
                      postal_code: TW6 2QA
                      country_code: GB
                  dropoff_location:
                    location:
                      code: LHR
                      name: London Heathrow Airport T234
                      telephone: (44) 3445446000
                      airport_location: true
                    address:
                      address_line_1: Central Heathrow Loc
                      address_line_2: Northrop Rd
                      city: London
                      postal_code: TW6 2QA
                      country_code: GB
