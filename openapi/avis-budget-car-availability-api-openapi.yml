              schema:
                $ref: '#/components/schemas/error_401'
              examples:
                un_authorized:
                  value:
                    status:
                      request_time: '2022-03-07T12:00:30Z'
                      request_errors: 1
                      errors:
                      - code: '401'
                        message: unauthorized
                        reason: unauthorized_client
                        details: Invalid Client Credentials
                    transaction:
                      system_id: C56a1700-43e1-11e9-95ce-e6a7a0e31bec
          description: 401 unauthorized error is a client-side error. Usually, this means the provided client credentials aren’t working or incorrect credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error_403'
              examples:
                forbidden:
                  value:
                    status:
                      request_time: '2022-03-07T12:00:30Z'
                      request_errors: 1
                      errors:
                      - code: '403'
                        message: Forbidden
                        reason: Forbidden
                        details: Authentication was provided, but the authenticated user dosen't have access to requested resource
                    transaction:
                      system_id: C56a1700-43e1-11e9-95ce-e6a7a0e31bec
          description: 403 Forbidden is returned when the is not authorized to access the requested resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_error_response'
              example:
                status:
                  request_time: '2019-01-04T15:15:30Z'
                  request_errors: 1
                  errors:
                  - code: '404'
                    message: Resource Not Found
                    reason: resource_failure
                    details: Server cannot find the requested resource. This may be due to incorrect URI or a resource that is not available.
                  - code: '223'
                    message: Not Found
                    reason: Invalid pickup_location.
                    details: The pick-up location entered is Sold Out for the dates you have entered
                  - code: '14381'
                    message: Not Found
                    reason: 'A One-Way Rental between given pickup_location and dropoff_location is not available '
                    details: 'A One-Way Rental between given pickup_location and dropoff_location is not available '
                  - code: '226'
                    message: Not Found
                    reason: Invalid dropoff_location.
                    details: There are no locations available for your Return address.
                  - code: '225'
                    message: Not Found
                    reason: Invalid pickup_location.
                    details: There are no locations available for your Pick-up address.
                  - code: '227'
                    message: Not Found
                    reason: Invalid pickup_location and dropoff_location.
                    details: Sorry! No <brand> locations are available in address provided.
          description: 404 Not Found is returned when server cannot find the matching request URI (either due to no results, or because of a non-existent endpoint or resource). Server may also respond with this status code when there is 401 or 403, which the service wants to mask for security reasons.
          x-amf-mediaType: application/json
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_error_response'
              example:
                status:
                  request_time: '2019-01-04T15:15:30Z'
                  request_errors: 1
                  errors:
                  - code: '415'
                    message: Unsupported Media Type
                    reason: Unsupported Media Type
                    details: org.mule.module.apikit.exception.UnsupportedMediaTypeException
          description: The request entity has a media type which the server or resource does not support. For example, the client uploads an image as image/svg+xml, but the server requires that images use a different format.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/availability_error_response'
              example:
                status:
                  request_time: '2019-01-04T15:15:30Z'
                  request_errors: 1
                  errors:
                  - code: '40018'
                    message: Service exception
                    reason: Service exception
                    details: Socket timeout from IMS Connect
                  - code: '610'
                    message: Service exception
                    reason: System exception from e-com backend.
                    details: System Exception occurred during location search.Please check the log for details.
          description: 500 Internal Server Error is returned when a system or application error has occurred. It generally indicates that something unexpected has gone wrong on the server. This is used for a standard server side exception for a persistent error on the server side.
