        quote_id:
          $ref: '#/components/schemas/quote_id'
    error_403:
      title: Error 403
      description: Forbidden
      required:
      - request_time
      - errors
      - request_errors
      type: object
      properties:
        request_time:
          format: date-time
          description: The time stamp of the request
