components:
  schemas:
    holiday_hours:
      title: Holiday/Seasonal Hours
      description: The holiday/seasonal operational schedule.
      type: array
      items:
        $ref: '#/components/schemas/holiday_hours_schedule'
    locations_error_status:
      title: Locations Error Status
      description: A container for the error details
      required:
      - request_time
      - errors
      - request_errors
      type: object
      properties:
        request_time:
          $ref: '#/components/schemas/date_time'
        request_errors:
          description: The number of errors that occurred
          type: integer
        errors:
          $ref: '#/components/schemas/locations_error_details'
    locations_locations:
      title: Location Search Result
      description: The list of available locations within a certain radius of the specified latitude/longitude
      required:
      - brand
      - address
      type: object
      properties:
        brand:
          description: ABG brand name
          type: string
          example: Avis
        code:
          description: 3-5 character alphanumeric location or airport code.
          type: string
          example: BOS
        name:
          description: Name of the product location.
          type: string
          example: Boston Logan Intl Airport
        telephone:
          description: Phone number of the product location.
          type: string
          example: 617-568-6600
        airport_location:
          description: Indicates whether the product location is an airport.
          type: boolean
        distance:
          description: Distance from the specified location for the distance unit. Applicable to proximity search only.
          type: number
        address:
          $ref: '#/components/schemas/location_address'
        skip_the_queue:
          title: Skip the Queue Indicator
          description: Indicator to check whether the location is enabled for the skip the queue feature.
          type: boolean
        hours_of_operation:
          $ref: '#/components/schemas/hours_of_operation'
        holiday_hours:
          $ref: '#/components/schemas/holiday_hours'
        dual_branded_location_mnemonic:
          description: Dual branded location mnemonic, used to perform Multi-branded search.
          type: string
    transaction:
      title: Request Transaction
      description: In the instance a request has failed, transaction identifiers allow you to quickly identify the failed request. The following request transaction identifier may be used by your application to identify a request. We recommend that you use this identifier in every request.
      type: object
      properties:
        transaction_id:
          $ref: '#/components/schemas/transaction_id'
        system_id:
          title: Internal Correlation Identifier
          description: A unique identifier generated internally by the application to identify the payload and troubleshoot.
          type: string
          example: i9332ffa-5250-11e9-8647-d663bd873d78
      example:
        transaction_id: test56
    locations_error_details:
      title: Locations Error Details
      description: The following describes the elements that can appear in the response body of an error.
      type: array
      items:
        type: object
        properties:
          code:
            description: The error code value
            type: string
          message:
            description: The HTTP status code message
            type: string
          reason:
            description: The reason the request has failed
            type: string
          details:
            description: Description of the error
            type: string
    location_address:
      title: Location Address
      description: Address information that you would like to associate to the user that is requesting the rental vehicle reservation, including geographic coordinates (if applicable)
      type: object
      properties:
        address_line_1:
          description: Address (line 1) of the user.
          type: string
        address_line_2:
          description: Address (line 2) of the user.
          type: string
        address_line_3:
          description: Address (line 3) of the user.
          type: string
        city:
          description: City name of the user.
          type: string
          example: Boston.
        state_name:
          description: State name of the user (if applicable).
          type: string
          example: Massachusetts
        postal_code:
          description: Numeric or alphanumeric postal code of the user, which varies by country (02128 or CT3).
          type: string
          example: W16PR
        country_code:
          description: 2-letter ISO 3166 country code of the user.
          type: string
          example: US
        lat:
          description: Geographic latitude of the location.
          type: string
          example: '40.690022'
        long:
          description: Geographic longitude of the location.
          type: string
          example: '-74.187506'
    locations_error_response:
      title: Locations Error Response
      required:
      - status
      - transaction
      type: object
      properties:
        status:
