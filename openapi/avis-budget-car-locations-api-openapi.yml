    success_status:
      title: Success Status
      description: Success Status object
      required:
      - request_time
      - success
      type: object
      properties:
        request_time:
          format: date-time
          description: The time stamp of the request
          type: string
        success:
          description: Success Details
          type: array
          items:
            $ref: '#/components/schemas/success_detail'
    transaction_id:
      title: Transaction Identifier
      description: The transaction identifier used to identify and troubleshoot a given request.
      type: string
      example: 391117cf-4470-4353-8b51-f00c3c098943
    success_detail:
      title: Success Detail
      description: A container for the success/error details.
      required:
      - code
      - message
      - details
      properties:
        code:
          description: The HTTP status code value
          type: string
        message:
          description: The HTTP status code message
          type: string
        details:
          description: Description of the success status
          type: string
    unauthorized_error:
      title: Unauthorized Error
      description: Unauthorized error details.
      type: object
      properties:
        error:
          description: Error type.
          type: string
        error_description:
          description: Error description.
          type: string
    hours_of_operation_day:
      title: Operating Hour for a Day
      description: The hours of operation for the day.
      type: object
      properties:
        day:
          title: Day of the Week
          description: Day of the week
          enum:
          - Sun
          - Mon
          - Tue
          - Wed
          - Thu
          - Fri
          - Sat
        first_slot_open_time:
          title: The First Slot Opening Time
          description: The first slot opening hours of the location.
          type: string
        first_slot_close_time:
          title: The First Slot Closing Time
          description: The first slot closing hours of the location.
          type: string
        second_slot_open_time:
          title: The Second Slot Opening Time
          description: The second slot opening hours of the location.
          type: string
        second_slot_close_time:
          title: The Second Slot Closing Time
          description: The second slot closing hours of the location.
          type: string
    holiday_hours_schedule:
      title: Holiday Hours of Operation Schedule
      description: The holiday and seasonal hours of operation schedule
      type: object
      properties:
        description:
          title: Holiday/Season Description
          description: Holiday/Seasonal day desciption
          type: string
        start_date:
          title: Start Date
          description: The holiday or seasonal start date
          type: string
        end_date:
          title: End Date
          description: The holiday or seasonal start date
          type: string
        first_slot_open_time:
          title: The First Slot Opening Time
          description: The first slot opening hours of the location.
          type: string
        first_slot_close_time:
          title: The First Slot Closing Time
          description: The first slot closing hours of the location.
          type: string
        second_slot_open_time:
          title: The Second Slot Opening Time
          description: The second slot opening hours of the location.
          type: string
        second_slot_close_time:
          title: The Second Slot Closing Time
          description: The second slot closing hours of the location.
          type: string
