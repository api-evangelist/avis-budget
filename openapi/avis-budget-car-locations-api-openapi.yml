openapi: 3.2.0
info:
  title: Rental Cars Car Locations API
  version: 2.0.0
  description: '## Car Locations V2


    The Car Locations suite allows a user to retrieve rental car locations.'
  x-short-description: 'Combined ABG Rental Cars API package: vehicle availability & rates, reservations, location search, and terms & conditions.'
servers:
- url: https://stage.abgapiservices.com
  description: Stage Environment
security:
- ABG-Access-Token: []
tags:
- name: Car Locations
  description: Keyword Search API
paths:
  /cars/locations/v2/keyword:
    summary: Keyword Search
    parameters:
    - name: brand
      description: The Avis, Budget, or Payless brand name.
      schema:
        enum:
        - Avis
        - Budget
        - Payless
        - ALL
        type: string
      in: query
      required: true
    - name: country_code
      description: 2-letter ISO 3166 country code representing the Point Of Sale and fetch results accordlingly.
      schema:
        maxLength: 2
        minLength: 2
        type: string
      in: query
    - name: keyword
      description: The location keyword you would like to search.
      schema:
        type: string
      in: query
      required: true
    - $ref: '#/components/parameters/transaction_id'
    - $ref: '#/components/parameters/client_id'
