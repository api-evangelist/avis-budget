          description: The confirmation number of the reservation.
          type: string
          example: 09369988GB2
    fuel_type:
      title: Fuel Type
      description: Indicates the vehicle fuel type.
      enum:
      - Diesel
      - Petrol
      - Hybrid
      - Electric
      type: string
      example: diesel
    reservation_contact:
      title: Reservation Contact
      description: The personal and contact information of the user you would like to associate to the user profile. If you would like to create a basic profile, you can provide the minimal contact information along with an indication of the desired brand. If you would like to create a preferred profile, you are required to provide many more parameters including driver license, payment information, and an election of several required options. If you do not provide this additional information, you will be unable to create a preferred profile.
      required:
      - last_name
      - first_name
      type: object
      properties:
        title:
          description: Title of the user.
          type: string
        first_name:
          description: First name of the user.
          type: string
        last_name:
          description: Last name of the user.
          type: string
        email:
          description: Email address of the user.
          type: string
        telephone:
          description: Telephone number of the user.
          type: string
        age:
          description: Driver’s age. This might influence the rates. Will be superseded by date of birth found in the profile provided in “membership_code”.
          type: number
        date_of_birth:
          format: date
          title: Date of Birth
          description: Driver’s date of birth. This might influence the rates. Will be superseded by “age” parameter or date of birth found in the profile provided in “membership_code”.
          type: string
          example: '1991-12-31'
    vehicle:
      title: Rental Vehicle
      description: Identifying information about the vehicle, including vehicle category (make/model), features, luggage capacity and the total cost.
      required:
      - capacity
      - category
      - features
      type: object
      properties:
        category:
          $ref: '#/components/schemas/reservation_vehicle_category'
        features:
          $ref: '#/components/schemas/vehicle_features'
        capacity:
          $ref: '#/components/schemas/vehicle_capacity'
    payment_preference:
      title: Payment Preference
      description: The payment preferences for the reservation. This could be a Customer's payment card details or a Booking Voucher or a Central Billing Account with the value of the reservation.
      required:
      - type
      type: object
      properties:
        type:
          description: 'This could be either Voucher, Central Billing Account, Customer Credit Card, Cash or MIXED.


            ** Voucher - Voucher issued that have a predetermined monetary value or discounts. ** CentralBillingAccount - Central Billing Account setup with the partnership. ** CustomerPaymentCard - Customer Payment Card. ** Cash - Cash as the method of payment.'
          enum:
          - Voucher
          - CentralBillingAccount
          - CustomerPaymentCard
          - Cash
          type: string
        id:
          description: This is a 6-8 digit number for vouchers. This could be static e.g. 12345678 for all reservations made. If the partner has their own internal reference number it should be passed in as the voucher number as a unique identifier for reconciliation.
          type: string
        billing_account_number:
          description: For Central Billing Accounts, companies that have signed a contract with Avis have an AV account number and Budget has BU account number that can be used by the company employees for renting cars at Avis or Budget for business purposes AV accounts are attached to an AWD/BCD number carrying the discounts, rates and further information for rental conditions to the specific company. e.g AV1236352973000 **Note** Pass ONLY the billing account number without AV or BU prefix.
          type: string
        fixed_value:
          description: The reservation value could be either Fixed or Full Credit. For Voucher based reservation, this should be passed as Fixed always. Represents the Voucher type.
          enum:
          - FixedValue
          - FullCredit
          - ACTO
          type: string
        electronic_indicator:
          description: This identifies the partner as a paperless supplier and needs to be marked as true
          type: boolean
        amount:
          description: This is the gross retail rate inclusive of tax and other prepaid charges and is returned in rate totals response as reservation total.
          type: number
        currency:
          $ref: '#/components/schemas/currency'
        payment_method:
          $ref: '#/components/schemas/payment'
        cost_control:
          description: Also known as CCI. This field is used to store cost control information from a travel order, purchase order number or company reference.
          type: string
    arrival_flight:
      title: Arrival Flight
      description: Arrival Flight information including the arrival datetime, location and travel preference.
      type: object
      properties:
        airline_code:
          $ref: '#/components/schemas/airline_code'
        airline_number:
          description: Identifying number assigned to the airline carrier flight segment.
          type: string
      example: '349723'
    payment:
      title: Payment
      description: User's payment details.
      required:
      - card_holder_name
      - card_number
      - card_type
      - expiry_date
      type: object
      properties:
        card_type:
          description: One of the supported Credit/Debit card types.
          enum:
          - VI
          - MC
          - AX
          - DN
          - CB
          - CC
          - JCB
          - CN
          - CP
          - DS
          - CT
          - PA
          type: string
          example: VI
        card_number:
          description: Card Number that's valid for the selected card_type.
          type: string
          example: 37473483483484220
        card_holder_name:
          description: Name presented in the payment card.
          type: string
          example: BRADLEY STEPHEN
        expiry_date:
          description: Expiry Date as found printed on the card.
          type: string
          example: 213
  parameters:
    brand:
      name: brand
      description: The Avis, Budget, or Payless brand name.
      schema:
        enum:
        - Avis
        - Budget
        - Payless
        type: string
      in: query
      required: true
    client_id:
      name: client_id
      description: Your client identifier.
      schema:
        maxLength: 50
        minLength: 8
        type: string
      in: header
      required: true
    confirmation_number:
      name: confirmation_number
      description: The confirmation number of the rental car reservation. The confirmation number is retrieved from the Create Reservation endpoint.
      schema:
        type: string
      in: query
      required: true
  securitySchemes:
    ABG-Access-Token:
      type: oauth2
      description: OAuth 2.0 client credentials flow used to authenticate all API requests in this package.
      flows:
        clientCredentials:
          tokenUrl: https://stage.abgapiservices.com/oauth/token/v2
          scopes: {}
