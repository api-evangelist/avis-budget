          description: Indicates whether the reservation distance is unlimited.
          type: boolean
          example: true
        distance_covered:
          description: The free distance covered for the duration of the rental period.
          type: number
          example: 500
        distance_unit:
          description: The unit of distance.
          type: string
          example: miles
        distance_overage:
          description: The cost per distance unit if the free distance in distance_covered is exceeded.
          type: number
          example: 0.15
    insurance_selection_note:
      title: Insurance Selection Note
      description: Indicates whether rental vehicle insurance coverage is included by DEFAULT (as applicable in select countries), or whether additional coverage specified by the user has been ACCEPTED, or DECLINED. There may be some countries that include the cost of insurance by DEFAULT. If a value of DEFAULT is returned, then the value in total_owed will be 0. If the user specifies additional insurance coverage, then the value in this field will be returned as ACCEPTED or DECLINED.
      enum:
      - DEFAULT
      - ACCEPTED
      - DECLINED
      type: string
      example: DEFAULT
    success_status:
      title: Success Status
      description: Success Status object
      required:
      - request_time
      - success
      type: object
      properties:
        request_time:
          format: date-time
          description: The time stamp of the request
          type: string
        success:
          description: Success Details
          type: array
          items:
            $ref: '#/components/schemas/success_detail'
    availability_extra:
      title: Availability Extra
      description: The ancillary products, special equipment, and other extras selected as part of reservation.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/product_type'
        description:
          description: Product description. This field is supported in BB and Featured BB API.
          type: string
        code:
          $ref: '#/components/schemas/product_code'
        quantity:
          description: 'The number of ancillary products to add to the reservation. For example, if a value of 2 is specified for quantity, and a code of CSS, then two child safety seats will be added to the reservation.

            The products that allow multiple quantity is: ADD/ADR, CBS/CSS, CIS, GPS, SAT, XMR, WFI, TAB, RSN, ATP with a  maximum quantity of 3 each.  All other products are maximum of 1.'
          default: 1
          minimum: 0
          type: number
        amount:
          description: The price of the ancillary product.
          type: number
          example: 19.99
        currency:
          $ref: '#/components/schemas/currency'
        tax_amount:
          description: The tax of the ancillary product.
          type: number
        total_owed:
          description: The total price of the ancillary product for the entirety of the reservation period.
          type: number
          example: 19.99
        secondary_amount:
          description: The price of the ancillary product.
          type: number
          example: 19.99
        secondary_currency:
          $ref: '#/components/schemas/currency'
        secondary_tax_amount:
          description: The tax of the ancillary product.
          type: number
        secondary_total_owed:
          description: The total price of the ancillary product for the entirety of the reservation period.
          type: number
          example: 19.99
        included_in_rate:
          description: Indicates whether price of Extra product is included in reservation_total.
          type: boolean
          example: true
        max_allowed_quantity:
          description: This field is applicable only for BB and featured BB APIs. Refers to maximum counter products that are allowed per reservation.
          type: number
        pickup_type:
          description: Indicates whether the counter product should be picked at counter, installed on the device or no pick up required.
          enum:
          - NO_PICKUP_REQUIRED
          - COUNTER_PICKUP
          - INSTALLED_ON_VEHICLE
          type: string
        tax_included:
          description: Indicates whether taxes are included in the cost (in total_owed).
          type: boolean
    booking_source:
      title: Booking Source
      description: Reservation Booking Source Info
      type: object
      properties:
        travel_agent_company:
          description: Booking Company Name
          type: string
        original_booking_source:
          description: The Original booking channel for the reservation .
          type: string
          example: N1W
        current_booking_source:
          description: The latest booking channel where on the reservation record. In many cases, original booking source will be same as booking source if there are no cross channel modifications.
          type: string
          example: B2C
    vehicle_onrequest_status:
      title: Vehicle Onrequest Status
      description: Vehicle OnRequest Status Information.
      enum:
      - Pending
      - Confirmed
      - Denied
      type: string
      example: Available
    currency:
      title: Currency
      description: Currency used for defining the amounts.
      type: string
      example: EUR
    dropoff_location:
      title: Dropoff Location
      description: Rental car dropoff location and address information.
      required:
      - address
      type: object
      properties:
        location:
          $ref: '#/components/schemas/location'
        address:
          $ref: '#/components/schemas/address'
    pickup_location:
      title: Pickup Location
      description: Rental car pickup location and address information.
      required:
      - address
      type: object
      properties:
        location:
          $ref: '#/components/schemas/location'
        address:
          $ref: '#/components/schemas/address'
    fee:
      title: Fee
      description: Fees applied to the reservation. All available fees and surcharges are returned in the response. Some of these fees are included in the rate, and others are for information purposes only, as they may apply but are not included in the total tax amount.
      type: object
      properties:
        amount:
          description: The cost of fees applied.
          type: number
        name:
          description: The name of the type of fee(s) applied.
          type: string
        included_in_total:
          description: The flag to indicate whether the fees or charges are included in the Total Reservation cost.
          type: boolean
      example:
        amount: 13.26
        name: Domestic Security Fee
