components:
  schemas:
    rental_experience:
      title: Rentalexperience
      description: Defines the rental experience type and associated details.
      required:
      - type
      type: object
      properties:
        type:
          description: Indicates the type of rental experience. Controlled vocabulary for consistency across APIs.
          type: string
          example: AvisFirst
        benefits:
          description: Collection of benefits and premium services included with the rental experience.
          type: array
          items:
            type: string
          example:
          - Curbside vehicle delivery by a personal concierge.
          - 2025 model year vehicles with low mileage.
          - Chat with your personal concierge for any in-trip issues.
          - Skip the pump — pay only for fuel used, at market price.
          - Curbside drop-off with your concierge.
        code:
          description: Avis First location code, returned only when type = AvisFirst. Matches vendor location code format
          type: string
    method_of_payment:
      title: Method of Payment
      description: Specifies the primary form used by the customer for the transaction. **CASH** - Cash as the method of payment. **LOYALTY_POINTS** - Loyalty points as the method of payment.
      enum:
      - CASH
      - LOYALTY_POINTS
      type: string
      example: CASH
    discount:
      title: Brand Discounts
      description: The rental vehicle brand rewards program code (also known as discount code) to be applied to the rate of the reservation.
      type: object
      properties:
        code:
          $ref: '#/components/schemas/discount_code'
      example: R566100
    cancel_reservation_v2_request:
      title: Cancel Vehicle Reservation Request
      description: The rental vehicle reservation that the user would like to cancel.
      required:
      - product
      - reservation
      - customer
      type: object
      properties:
        product:
          $ref: '#/components/schemas/product'
        transaction:
          $ref: '#/components/schemas/transaction'
        reservation:
          $ref: '#/components/schemas/cancel_request'
        customer:
          $ref: '#/components/schemas/customer_only_contact'
      example:
        product:
          brand: Avis
        transaction:
          transaction_id: '89474934'
        reservation:
          email_notification: true
          confirmation:
            number: 10768985US3
        customer:
          contact:
            last_name: STEPHEN
    vehicle_capacity:
      title: Vehicle Capacity
      description: Rental vehicle passenger seat and luggage capacity information.
      type: object
      properties:
        doors:
          description: The number of vehicle doors.
          type: string
          example: '4'
        seats:
          description: The number of passenger seats in the rental vehicle.
          type: string
          example: '5'
        mpg:
          description: Miles per gallon (MPG) of the vehicle.
          type: string
          example: 27/35
        luggage_capacity:
          $ref: '#/components/schemas/luggage_capacity'
        fuel_type:
          $ref: '#/components/schemas/fuel_type'
    reservation_rate_totals_response:
      title: Reservation Rate Totals
      description: The fees, rates, and discounts applied to the reservation, with a breakdown of the reservation total.
      required:
      - rate
      type: object
      properties:
        rate:
          $ref: '#/components/schemas/reservation_rate_response'
        totals:
          $ref: '#/components/schemas/totals'
    reservation_customer:
      title: Reservation Customer
      description: Information about the rental car customer. Only one customer can be specified in the request.
      required:
      - contact
      properties:
        contact:
          $ref: '#/components/schemas/reservation_contact'
        type:
          $ref: '#/components/schemas/customer_type'
        driver:
          $ref: '#/components/schemas/driver'
        address:
          $ref: '#/components/schemas/address'
        delivery_address:
          $ref: '#/components/schemas/address'
        collection_address:
          $ref: '#/components/schemas/address'
    reservation_vehicle_category:
      title: Reservation Vehicle Category
      description: Identifying information and details about the rental vehicle.
      type: object
      properties:
        name:
          title: Name
          description: The name of the vehicle.
          type: string
          example: Volvo XC 60
        make:
          title: Make
          description: Make of the vehicle.
          type: string
          example: Volvo
        model:
          title: Make Model
          description: Model of the vehicle.
          type: string
          example: XC60
        sipp_code:
          $ref: '#/components/schemas/sipp_code'
        vehicle_status:
          $ref: '#/components/schemas/vehicle_status'
        vehicle_class_code:
          $ref: '#/components/schemas/vehicle_class_code'
        vehicle_class_name:
          title: Vehicle Class Name
          description: The name of the vehicle class.
          type: string
          example: Economy
        vehicle_transmission:
          $ref: '#/components/schemas/transmission'
        image_url:
          $ref: '#/components/schemas/url'
        mpg:
          description: Vehicle MPG
          type: string
        vehicle_onrequest_status:
          $ref: '#/components/schemas/vehicle_onrequest_status'
    product:
      title: Product Brand
      description: The rental car product brand name information for the reservation.
      required:
      - brand
      type: object
      properties:
        brand:
          $ref: '#/components/schemas/brand'
        iata_number:
          $ref: '#/components/schemas/iata_number'
    vehicle_status:
      title: Vehicle Status
      description: Vehicle Status Information.
      enum:
      - OnRequest
      - Available
      type: string
      example: Available
    loyalty_redemption:
      title: Loyalty Redemption
      description: Loyalty Redemption
      type: object
      properties:
        method_of_payment:
          $ref: '#/components/schemas/method_of_payment'
        redemption_points:
          title: Redemption Points
          description: The number of loyalty points used for the payment.
          type: integer
          example: 500
        currency_value:
          description: The monetary value equivalent to the redeemed loyalty points.
          type: number
          example: 50
        currency:
          description: The currency in which the equivalent value is calculated.
          type: string
          example: USD
    availability_loyalty:
      title: Availability Loyalty Program
      description: The Frequent Traveler Program (FTP) to be applied to the reservation. This entitles the user the opportunity to earn miles or points with ABG partners, such as airlines, hotels and other select companies. For example, the Lufthansa Miles & More Rewards Program. Surcharges may apply.
      type: object
      properties:
        company_id:
          description: The Frequent Traveler Program identifier of the airline, hotel, or other select company.
          type: string
          example: AD
        code:
          description: The unique Frequent Traveler Program (FTP) number of the traveler.
          type: string
          example: M21R322
      example:
        company_id: some text
        code: some text
    quote_id:
      title: Quote Identifier
      description: A unique identifier representing a specific rate quote. This ID is required for re-shop and booking requests to retain the originally quoted rate.
      type: string
      example: abc123xyz-456def789-ghijk012
    discount_code:
      title: Discount Code
      description: The rental vehicle brand discount code. This field can be an Avis Worldwide Discount (AWD), Budget Car Discount (BCD), or a Payless Discount Number (PDN) code.
      type: string
      example: R566100
    taxes_fees:
      title: Rental Taxes and Fees
      description: All available rental taxes and fees applied to the reservation.
      type: object
      properties:
        taxes:
          title: Rental Taxes
          description: Taxes applied to the reservation in the localized currency.
          type: array
          items:
            $ref: '#/components/schemas/tax'
        fees:
          title: Fees
          description: Fees applied to the reservation. All available fees and surcharges are returned in the response. Some of these fees are included in the rate, and others are for information purposes only, as they may apply but are not included in the total tax amount.
          type: array
          items:
            $ref: '#/components/schemas/fee'
    reservation_request:
      title: Reservation Request
      description: Reservation information for the rental vehicle reservation, including the pickup, dropoff, and vehicle class.
      required:
      - pickup_date
      - pickup_location
      - dropoff_location
      - dropoff_date
      - vehicle_sipp_code
      type: object
      properties:
        email_notification:
          description: Indicates the email notifications for create, modify and cancel can be sent or suppressed for a user.
          type: boolean
          example: true
        pickup_date:
          description: ISO 8601 date and time of pickup.
          type: string
          example: '2017-11-15T18:00:00.000'
        pickup_location:
          description: Rental car pickup location code.
          type: string
          example: EWR
        dropoff_date:
          description: ISO 8601 date and time of dropoff.
          type: string
          example: '2017-11-15T18:00:00.000'
        dropoff_location:
          description: Rental car dropoff location and address information.
          type: string
        confirmation:
          $ref: '#/components/schemas/reservation_confirmation'
        vehicle_sipp_code:
          $ref: '#/components/schemas/reservation_vehicle_sipp_code'
        vehicle_status:
          $ref: '#/components/schemas/vehicle_status'
        rental_experience:
          $ref: '#/components/schemas/rental_experience'
        email_language:
          description: Language for email. Applicable to North America email template.
          enum:
          - ENGLISH
          - FRENCH
          - SPANISH
          type: string
        travel_agent_id:
          description: Travel Agent Id
          type: string
        travel_agent_company:
          description: Travel Agent Company
          type: string
        remark:
          description: Reservation remarks
          type: string
    airline_code:
      title: Airline Code
      description: 2-character IATA airline code.
      type: string
      example: BA
    reservation_customer_response:
      title: Reservation Customer Response
      description: Information about the rental car customer. Only one customer can be specified in the request.
      properties:
        contact:
          $ref: '#/components/schemas/reservation_contact'
        driver:
          $ref: '#/components/schemas/driver'
        address:
          $ref: '#/components/schemas/address'
        delivery_address:
          $ref: '#/components/schemas/address'
        collection_address:
          $ref: '#/components/schemas/address'
        digital_experience:
          $ref: '#/components/schemas/customer_experience'
    luggage_capacity:
      title: Luggage Capacity
      type: object
