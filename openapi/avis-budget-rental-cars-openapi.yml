    central_billing_membership:
      title: Brand Membership
      description: Central billing account profile identification information.
      type: object
      properties:
        code:
          description: Corporate membership code for central billing account profile.
          type: string
          example: M21R322
    code:
      title: Code
      description: ''
      type: string
    reservation_confirmation:
      title: Reservation Confirmation Number
      description: Basic confirmation details for the rental vehicle reservation.
      required:
      - number
      type: object
      properties:
        number:
          description: The confirmation number of the reservation.
          type: string
          example: 09369988GB2
        rental_agreement_number:
          description: Agreement number provided to customers for tracking their rental.
          type: string
          example: '306443885'
        external_reference_number:
          description: The external booking reference .
          type: string
          example: US973OP34835
        pickup_date:
          description: ISO 8601 date and time of pickup.
          type: string
          example: '2026-11-15T18:00:00'
        dropoff_date:
          description: ISO 8601 date and time of dropoff.
          type: string
          example: '2026-11-17T18:00:00'
        skip_the_queue:
          title: Skip the Queue Indicator
          description: Indicator to check whether the location is enabled for the skip the queue feature. This flag is available
            only for Create and Modify Reservation APIs.
          type: boolean
    availability_confirmation:
      title: Availability Confirmation
      description: Basic confirmation details for the rental vehicle reservation.
      required:
      - number
      type: object
      properties:
        number:
          description: The confirmation number of the reservation.
          type: string
          example: 09369988GB2
        pickup_date:
          description: ISO 8601 date and time of pickup.
          type: string
          example: '2017-11-15T18:00:00'
        dropoff_date:
          description: ISO 8601 date and time of dropoff.
          type: string
          example: '2017-11-17T18:00:00'
    reservation_contact:
      title: Reservation Contact
      description: The personal and contact information of the user you would like to associate to the user profile. If you
        would like to create a basic profile, you can provide the minimal contact information along with an indication of
        the desired brand. If you would like to create a preferred profile, you are required to provide many more parameters
