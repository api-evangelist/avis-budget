          example: 617-568-6600
        hours:
          description: Operating hours of the product location.
          type: string
          example: Sun-Sat 0:00 AM - 12:00 AM and 0:00 AM - 12:00 AM
        airport_location:
          description: Indicates whether the product location is an airport.
          type: boolean
          example: true
    location_address:
      title: Location Address
      description: Address information that you would like to associate to the user that is requesting the rental vehicle
        reservation, including geographic coordinates (if applicable)
      type: object
      properties:
        address_line_1:
          description: Address (line 1) of the user.
          type: string
        address_line_2:
          description: Address (line 2) of the user.
          type: string
        address_line_3:
          description: Address (line 3) of the user.
          type: string
        city:
          description: City name of the user.
          type: string
          example: Boston.
        state_name:
          description: State name of the user (if applicable).
          type: string
          example: Massachusetts
        postal_code:
          description: Numeric or alphanumeric postal code of the user, which varies by country (02128 or CT3).
          type: string
          example: W16PR
        country_code:
          description: 2-letter ISO 3166 country code of the user.
          type: string
          example: US
        lat:
          description: Geographic latitude of the location.
          type: string
          example: '40.690022'
        long:
          description: Geographic longitude of the location.
          type: string
          example: '-74.187506'
    locations_locations:
      title: Location Search Result
      description: The list of available locations within a certain radius of the specified latitude/longitude
      required:
      - brand
      - address
      type: object
      properties:
        brand:
          description: ABG brand name
          type: string
          example: Avis
        code:
          description: 3-5 character alphanumeric location or airport code.
          type: string
          example: BOS
        name:
          description: Name of the product location.
          type: string
          example: Boston Logan Intl Airport
        telephone:
          description: Phone number of the product location.
          type: string
          example: 617-568-6600
        airport_location:
          description: Indicates whether the product location is an airport.
          type: boolean
        distance:
          description: Distance from the specified location for the distance unit. Applicable to proximity search only.
          type: number
        address:
          $ref: '#/components/schemas/location_address'
        skip_the_queue:
          title: Skip the Queue Indicator
          description: Indicator to check whether the location is enabled for the skip the queue feature.
          type: boolean
        hours_of_operation:
          $ref: '#/components/schemas/hours_of_operation'
        holiday_hours:
          $ref: '#/components/schemas/holiday_hours'
        dual_branded_location_mnemonic:
          description: Dual branded location mnemonic, used to perform Multi-branded search.
          type: string
    reservation_loyalty:
      title: Reservation Loyalty Program
      description: The Frequent Traveler Program (FTP) to be applied to the reservation. This entitles the user the opportunity
        to earn miles or points with ABG partners, such as airlines, hotels and other select companies. For example, the Lufthansa
        Miles & More Rewards Program. Surcharges may apply.
      type: object
      properties:
        company_id:
          description: The Frequent Traveler Program identifier of the airline, hotel, or other select company.
          type: string
          example: AD
        code:
          description: The unique Frequent Traveler Program (FTP) number of the traveler.
          type: string
          example: M21R322
        redemption:
          $ref: '#/components/schemas/loyalty_redemption'
      example:
        company_id: some text
        code: some text
    availability_loyalty:
      title: Availability Loyalty Program
      description: The Frequent Traveler Program (FTP) to be applied to the reservation. This entitles the user the opportunity
        to earn miles or points with ABG partners, such as airlines, hotels and other select companies. For example, the Lufthansa
        Miles & More Rewards Program. Surcharges may apply.
      type: object
      properties:
        company_id:
          description: The Frequent Traveler Program identifier of the airline, hotel, or other select company.
          type: string
          example: AD
        code:
          description: The unique Frequent Traveler Program (FTP) number of the traveler.
          type: string
          example: M21R322
      example:
        company_id: some text
        code: some text
    loyalty_redemption:
      title: Loyalty Redemption
      description: Loyalty Redemption
      type: object
      properties:
        method_of_payment:
          $ref: '#/components/schemas/method_of_payment'
        redemption_points:
          title: Redemption Points
          description: The number of loyalty points used for the payment.
          type: integer
          example: 500
        currency_value:
          description: The monetary value equivalent to the redeemed loyalty points.
          type: number
          example: 50
        currency:
          description: The currency in which the equivalent value is calculated.
          type: string
          example: USD
    luggage_capacity:
      title: Luggage Capacity
      type: object
      properties:
        large_suitcase:
          description: The number of large suitcases that can be accommodated in the rental vehicle.
          type: string
        small_suitcase:
          description: The number of small suitcases that can be accommodated in the rental vehicle.
          type: string
    reservation_membership:
      title: Reservation Membership
      description: The customer membership information
      type: object
      properties:
        code:
          description: The brand membership program code. This can be an Avis wizard number, Budget customer number, or Payless
            Perks number.
          type: string
          example: M21R322
        partner_membership_code:
          description: Customer's partner membership code associated with partner membership program.
          type: string
        partner_membership_loyalty_level:
          description: The partner membership loyalty level or status.
          type: string
        benefits_applied:
          description: Indicates whether the partner membership benefits are applied
          type: boolean
        description:
          description: Details of the membership, acknowledging the benefits associated
          type: string
    availability_membership:
      title: Availability Membership
      description: The customer membership information.
      type: object
      properties:
        code:
          description: The membership program code, such as an Avis Wizard number, Budget customer number, or Payless Perks
            number.
          type: string
          example: W4S322
        partner_membership_code:
          description: The customer's membership code for an associated partner program.
          type: string
        partner_membership_loyalty_level:
          description: The loyalty level or status in the partner membership program.
          type: string
        benefits_applied:
          description: Indicates whether the partner membership benefits are applied.
          type: string
        description:
          description: Details of the membership, acknowledging the benefits associated.
          type: string
    method_of_payment:
      title: Method of Payment
      description: Specifies the primary form used by the customer for the transaction. **CASH** - Cash as the method of payment.
        **LOYALTY_POINTS** - Loyalty points as the method of payment.
      enum:
      - CASH
      - LOYALTY_POINTS
      type: string
      example: CASH
    partial_modify_confirmation:
      title: Partial Modify Confirmation
      description: Basic confirmation details for the rental vehicle reservation.
      required:
      - number
      type: object
      properties:
        number:
          description: The confirmation number of the reservation.
          type: string
          example: 09369988GB2
    partial_modify_request:
      title: Partial Modify Reservation Request
      description: The rental vehicle reservation details, including the rate, insurance coverage, rental extras (such as
        GPS), passenger, and payment information.
      required:
      - product
      - reservation
      - rate_totals
      - customer
      type: object
      properties:
        product:
          $ref: '#/components/schemas/product'
        transaction:
          $ref: '#/components/schemas/transaction'
        reservation:
          $ref: '#/components/schemas/partial_modify_reservation_request'
        arrival_flight:
          $ref: '#/components/schemas/arrival_flight'
        payment_preference:
          $ref: '#/components/schemas/payment_preference'
        customer:
          $ref: '#/components/schemas/reservation_customer'
    partial_modify_reservation_request:
      title: Partial Modify Reservation
      description: Reservation information for the rental vehicle reservation, including the pickup, dropoff, and vehicle
        class.
      type: object
      properties:
        confirmation:
          $ref: '#/components/schemas/partial_modify_confirmation'
    partial_modify_reservation_v2_response:
      title: 200 Partial Modify Response
      description: The following demonstrates an example of a successful request for this endpoint.
      required:
      - status
      - transaction
      type: object
      properties:
        status:
          $ref: '#/components/schemas/success_status'
        transaction:
          $ref: '#/components/schemas/transaction'
    partial_success_status:
      title: Partial Success Status
      description: Success Status object
      required:
      - request_time
      - success
      - errors
      type: object
      properties:
        request_time:
          format: date-time
          description: The time stamp of the request
          type: string
        success:
          title: Success Details
          description: Success Details
          type: array
          items:
            $ref: '#/components/schemas/success_detail'
        errors:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/error'
    partner_discount:
      title: Partner Discount
      description: The partner commercial discount program. The discount to be applied to drive the rate of the booking.
      type: object
      properties:
        program:
          title: Commercial Discount Name
          description: Valid partner discount name from the user request, as agreed by partner integration.
          type: string
          example: VIP
    partner_loyalty:
      title: Partner Loyalty
      description: The partner loyalty discount program. The partner loyalty to be applied to drive the rate of booking.
      type: object
      properties:
        program:
          title: Partner Program Name
          description: Valid partner loyalty program from the user request, as agreed by partner integration.
          type: string
          example: Platinum
    partner_valet:
      title: Partner Valet
      description: 'Partners can initiate various reservations for the Delivery and Collection valet feature. Currently this
        feature is available **only for Avis** brand.

        * **Customer Reservation**: Partners can initiate this reservation with a partner-specific customer confirmation number.

        * **Driver Delivery Reservation**: Partners can initiate this reservation during the car delivery scenario. Partner
        has to pass partner-specific customer confirmation number along with partner-specific driver confirmation number.
        driver_confirmation is mandatory for this type of reservation.'
      required:
      - type
      type: object
      properties:
        driver_reservation_reference:
          $ref: '#/components/schemas/driver_reservation_reference'
        customer_reservation_reference:
          $ref: '#/components/schemas/customer_reservation_reference'
        type:
          $ref: '#/components/schemas/valet_type'
    pay_total:
      title: Pay Total
      description: The total reservation rate, taxes and fees for the entirety of the reservation. This object is applicable
        only for Best Buy API.
      type: object
      properties:
        extras_total:
          description: Total cost of the specified ancillary products (such as GPS).
          type: number
        fees_total:
          description: Total cost of fees.
          type: number
        original_reservation_total:
          description: Original total cost of the reservation.
          type: number
        taxes_fees_total:
          description: Total cost of the combined taxes and fees for the reservation.
          type: number
        vehicle_total:
          description: Total cost of the rental vehicle.
          type: number
        taxes_total:
          description: Total cost of taxes.
          type: number
        reservation_total:
          description: Total cost of the reservation.
          type: number
        insurance_total:
          description: Total cost of the specified rental insurance coverage.
          type: number
          example: 7
        original_vehicle_total:
          description: Original total cost of the rental vehicle.
          type: number
        netvoucher_total:
          description: Total Net Voucher Amount
          type: number
        rate_code:
          $ref: '#/components/schemas/rate_code'
      additionalProperties: true
    payment:
      title: Payment
      description: User's payment details.
      required:
      - card_holder_name
      - card_number
      - card_type
      - expiry_date
      type: object
      properties:
        card_type:
          description: One of the supported Credit/Debit card types.
          enum:
          - VI
          - MC
          - AX
          - DN
          - CB
          - CC
          - JCB
          - CN
          - CP
          - DS
          - CT
          - PA
          type: string
          example: VI
        card_number:
          description: Card Number that's valid for the selected card_type.
          type: string
          example: 37473483483484220
        card_holder_name:
          description: Name presented in the payment card.
          type: string
          example: BRADLEY STEPHEN
        expiry_date:
          description: Expiry Date as found printed on the card.
          type: string
          example: 213
    payment_preference:
      title: Payment Preference
      description: The payment preferences for the reservation. This could be a Customer's payment card details or a Booking
        Voucher or a Central Billing Account with the value of the reservation.
      required:
      - type
      type: object
      properties:
        type:
          description: 'This could be either Voucher, Central Billing Account, Customer Credit Card, Cash or MIXED.


            ** Voucher - Voucher issued that have a predetermined monetary value or discounts. ** CentralBillingAccount -
            Central Billing Account setup with the partnership. ** CustomerPaymentCard - Customer Payment Card. ** Cash -
            Cash as the method of payment.'
          enum:
          - Voucher
          - CentralBillingAccount
          - CustomerPaymentCard
          - Cash
          type: string
        id:
          description: This is a 6-8 digit number for vouchers. This could be static e.g. 12345678 for all reservations made.
            If the partner has their own internal reference number it should be passed in as the voucher number as a unique
            identifier for reconciliation.
          type: string
        billing_account_number:
          description: For Central Billing Accounts, companies that have signed a contract with Avis have an AV account number
            and Budget has BU account number that can be used by the company employees for renting cars at Avis or Budget
            for business purposes AV accounts are attached to an AWD/BCD number carrying the discounts, rates and further
            information for rental conditions to the specific company. e.g AV1236352973000 **Note** Pass ONLY the billing
            account number without AV or BU prefix.
          type: string
        fixed_value:
          description: The reservation value could be either Fixed or Full Credit. For Voucher based reservation, this should
            be passed as Fixed always. Represents the Voucher type.
          enum:
          - FixedValue
          - FullCredit
          - ACTO
          type: string
        electronic_indicator:
          description: This identifies the partner as a paperless supplier and needs to be marked as true
          type: boolean
        amount:
          description: This is the gross retail rate inclusive of tax and other prepaid charges and is returned in rate totals
            response as reservation total.
          type: number
        currency:
          $ref: '#/components/schemas/currency'
        payment_method:
          $ref: '#/components/schemas/payment'
        cost_control:
          description: Also known as CCI. This field is used to store cost control information from a travel order, purchase
            order number or company reference.
          type: string
