    availability_extra:
      title: Availability Extra
      description: The ancillary products, special equipment, and other extras selected as part of reservation.
      type: object
      properties:
        type:
          $ref: '#/components/schemas/product_type'
        description:
          description: Product description. This field is supported in BB and Featured BB API.
          type: string
        code:
          $ref: '#/components/schemas/product_code'
        quantity:
          description: 'The number of ancillary products to add to the reservation. For example, if a value of 2 is specified
            for quantity, and a code of CSS, then two child safety seats will be added to the reservation.

            The products that allow multiple quantity is: ADD/ADR, CBS/CSS, CIS, GPS, SAT, XMR, WFI, TAB, RSN, ATP with a  maximum
            quantity of 3 each.  All other products are maximum of 1.'
          default: 1
          minimum: 0
          type: number
        amount:
          description: The price of the ancillary product.
          type: number
          example: 19.99
        currency:
          $ref: '#/components/schemas/currency'
        tax_amount:
          description: The tax of the ancillary product.
          type: number
        total_owed:
          description: The total price of the ancillary product for the entirety of the reservation period.
          type: number
          example: 19.99
        secondary_amount:
          description: The price of the ancillary product.
          type: number
          example: 19.99
        secondary_currency:
          $ref: '#/components/schemas/currency'
        secondary_tax_amount:
          description: The tax of the ancillary product.
          type: number
        secondary_total_owed:
          description: The total price of the ancillary product for the entirety of the reservation period.
          type: number
          example: 19.99
        included_in_rate:
          description: Indicates whether price of Extra product is included in reservation_total.
          type: boolean
          example: true
        max_allowed_quantity:
          description: This field is applicable only for BB and featured BB APIs. Refers to maximum counter products that
            are allowed per reservation.
          type: number
        pickup_type:
          description: Indicates whether the counter product should be picked at counter, installed on the device or no pick
            up required.
          enum:
          - NO_PICKUP_REQUIRED
          - COUNTER_PICKUP
          - INSTALLED_ON_VEHICLE
          type: string
        tax_included:
          description: Indicates whether taxes are included in the cost (in total_owed).
          type: boolean
