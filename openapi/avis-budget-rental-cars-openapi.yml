    insurance:
      title: Rental Insurance Coverage
      description: The insurance coverage to be applied to the entirety of the reservation. Types of insurance includes Cover
        The Car (CDW), Cover My Liability (ALI), Cover Myself (PAI), and Cover My Belongings (PEP), Package (PKG). If insurance
        coverage is specified in the request, taxes are included in the total cost (in total_owed). Any preselected insurance
        coverage specified by a user within their wizard profile should be passed in the request. For example, if the user
        has selected Cover My Belongings (PEP) in their profile, then pass PEP.
      type: object
      properties:
        code:
          $ref: '#/components/schemas/insurance_code'
        name:
          $ref: '#/components/schemas/insurance_name'
        amount:
          description: The daily cost of the specified insurance coverage.
          type: number
        excess_amount:
          description: The insurance excess amount available as a part of the coverage.
          type: number
        currency:
          $ref: '#/components/schemas/currency'
        total_owed:
          description: Total owed of the specified insurance coverage for the entirety of the reservation.
          type: number
        secondary_amount:
          description: The daily cost of the specified insurance coverage.
          type: number
        secondary_excess_amount:
          description: The insurance excess amount available as a part of the coverage.
          type: number
        secondary_currency:
          $ref: '#/components/schemas/currency'
        secondary_total_owed:
          description: Total owed of the specified insurance coverage for the entirety of the reservation.
          type: number
        included_in_rate:
          description: Indicates whether price of Insurance product is included in reservation_total.
          type: boolean
          example: true
        selection_note:
          $ref: '#/components/schemas/insurance_selection_note'
        selected:
          description: Indicates whether insurance coverage has been selected by the user for the reservation. If the specified
            insurance coverage is accepted, a value of ACCEPTED will be returned in selection_note.
          type: boolean
          example: true
        tax_included:
          description: Indicates whether taxes are included in the cost (in total_owed).
          type: boolean
          example: true
    insurance_code:
      title: Insurance Code
      description: 3-character code of the insurance coverage.
      enum:
      - ALI
      - CDW
      - LDW
      - PAI
      - LI
      - PEP
      - SCDW
      - SPAI
      - STP
      - TP
      - PKG
      type: string
      example: CDW
    insurance_name:
      title: Insurance Name
      description: Name of the insurance coverage code/type.
      enum:
      - Additional Liability Insurance
      - Collision Damage Waiver
      - Loss Damage Waiver
      - Personal Accident Insurance
      - Additional Protection Insurance
      - Personal Effects Protection
      - Super Collision Damage Waiver
      - Super Personal Accident Insurance
      - Super Theft Protection
      - Theft Protection
      - Package Protection
      type: string
      example: Collision Damage Waiver
    insurance_selection_note:
      title: Insurance Selection Note
      description: Indicates whether rental vehicle insurance coverage is included by DEFAULT (as applicable in select countries),
        or whether additional coverage specified by the user has been ACCEPTED, or DECLINED. There may be some countries that
        include the cost of insurance by DEFAULT. If a value of DEFAULT is returned, then the value in total_owed will be
        0. If the user specifies additional insurance coverage, then the value in this field will be returned as ACCEPTED
        or DECLINED.
      enum:
      - DEFAULT
      - ACCEPTED
      - DECLINED
      type: string
      example: DEFAULT
