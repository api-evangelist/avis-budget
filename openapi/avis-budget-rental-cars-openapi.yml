            code: XMR
            quantity: 24.64
            amount: 6.1
            total_owed: 68.22
          - type: DaysOff
            code: BBS
            quantity: 10.33
            amount: 12.95
            total_owed: 46.59
        - - type: DaysOff
            code: ADR
            quantity: 17.09
            amount: 38.26
            total_owed: 98.75
          - type: Upgrade
            code: SNW
            quantity: 24.2
            amount: 53.96
            total_owed: 3.34
        description: some text
