openapi: 3.0.2
info:
  title: Rental Cars
  version: 2.0.0
  description: "## Car Locations V2\n\nThe Car Locations suite allows a user to retrieve rental car locations.\n\n## Location\
    \ Search\n\nThe Location Search APIs finds rental locations based on keywords supporting multiple brands like Avis, Budget,\
    \ and Payless.\n\n### Keyword search\nFor example, if you search Boston, it returns locations such as Boston Logan International\
    \ Airport, 100 Clarendon Street, and 2 Seaport Lane. This can be used for autocomplete in rental location searches.\n\n\
    The APIs returns location details like code, address, hours, and coordinates.\n\nNext step? Utilize the Car Availability\
    \ endpoint for rate and availability info.\n\n## Car Availability V2\n\nThe Car Availability suite retrieves the rate\
    \ and availability of a given rental car request.\n\nView the Rates Guide obtains all information related to a successful\
    \ rate request.\n\n### Car Availability\nThe Car Availability endpoint retrieves basic rate and availability information\
    \ of a given rental car request. It also allows to shop for inclusive rates (rates inclusive with the coverages and counter\
    \ products).\n\nThe response contains a vehicles array with each of the available vehicles that match the search criteria.\
    \ This includes the base rate, and any discount, membership, and promotional coupons applied to the rate.\n\nThe cars\
    \ and rates returned by this endpoint are influenced by the age of the driver.  The “age” or “date_of_birth” can be provided\
    \ as parameters.  If the “membership_code” is provided and the profile associated with that code has a valid date of birth,\
    \ that will take precedence over any of the query parameters provided.  The order of precedence for age calculations is:\
    \ membership_code -> age -> date_of_birth.\n\nWhat's next? Use the Car Rate endpoint to get a detailed rate.\n\n### Car\
    \ Rate\nThe Car Rate endpoint retrieves detailed rate information of a given rental car request.\n\nThe response contains\
    \ the reservation distance limitations, rate of insurance coverage, ancillary products (e.g. GPS), and a breakdown of\
    \ the reservation totals, including reservation cost, taxes and fees. It also contains the discount, loyalty, membership,\
    \ and coupon applied to the rate for the reservation. What's next? Use the Car Reservation endpoint to book a car. The\
    \ API also returns Insurance Excess amounts for eligible coverages. Secondary rates return an additional pricing representation\
    \ for the same offer in a requested currency and pricing basis, without changing the existing primary pricing contract.\
    \ Primary fields remain the source of the original/default rental pricing, while secondary pricing is returned only as\
    \ supplemental data when requested.\n\n## Car Reservation V2\n\nThe Car Reservations suite allows a rental car to be reserved,\
    \ or an existing reservation to be updated, cancelled or viewed.\n\n### Create Reservation\nThe Create Reservation endpoint\
    \ allows a rental car to be reserved.\n\nThe response will contain a breakdown of the reservation, including the rate,\
    \ confirmation details, rental vehicle pick-up and drop-off location details, and taxes and fees. What's next? Display\
    \ a reservation summary by calling the View Reservation endpoint.\n\nThe API supports the Processing of Paperless Voucher\
    \ reservations for the Avis, Budget or Payless. The paperless voucher account billing is supported only when the IATA\
    \ number is set by ABG to support Paperless Vouchering and reservations are made specifying the Voucher value and electronic\
    \ processing in the reservation request.\n\n### View Reservation\nThe View Reservation endpoint retrieves the reservation\
    \ details for an existing rental car reservation.\n\n### Cancel Reservation\nThe Cancel Reservation endpoint allows an\
    \ existing rental car reservation to be cancelled.\n\nThe response will contain basic cancellation details that indicate\
    \ the request was successful.\n\n## Car Terms and Condition\n\nTerms and Conditions API describes the location-specific\
    \ details. \n* Returns the terms in text format. so that it can be used in FAQs."
  x-short-description: 'Combined ABG Rental Cars API package: vehicle availability & rates, reservations, location search,
    and terms & conditions.'
