      enum:
      - MoneyOff
      - GasOff
      - DaysOff
      - Upgrade
      type: string
      example: Upgrade
    create_modify_request:
      title: Create Modify Reservation Request
      description: The rental vehicle reservation details, including the rate, insurance coverage, rental extras (such as
        GPS), passenger, and payment information.
      required:
      - product
      - reservation
      - rate_totals
      - customer
      type: object
      properties:
        product:
          $ref: '#/components/schemas/product'
        transaction:
          $ref: '#/components/schemas/transaction'
        reservation:
          $ref: '#/components/schemas/reservation_request'
        rate_totals:
          $ref: '#/components/schemas/rate_totals_request'
        insurance:
          title: Rental Insurance Coverage
          description: The insurance coverage to be applied to the entirety of the reservation. Types of insurance includes
            Cover The Car (CDW), Cover My Liability (ALI), Cover Myself (PAI), and Cover My Belongings (PEP), Package (PKG).
            If insurance coverage is specified in the request, taxes are included in the total cost (in total_owed). Any preselected
            insurance coverage specified by a user within their wizard profile should be passed in the request. For example,
            if the user has selected Cover My Belongings (PEP) in their profile, then pass PEP.
          type: array
          items:
            $ref: '#/components/schemas/insurance'
        extras:
          $ref: '#/components/schemas/extras'
        arrival_flight:
          $ref: '#/components/schemas/arrival_flight'
        payment_preference:
          $ref: '#/components/schemas/payment_preference'
        customer:
          $ref: '#/components/schemas/reservation_customer'
      example:
        product:
          brand: Avis
        transaction:
          transaction_id: '2423423467'
        reservation:
          email_notification: true
          pickup_date: '2020-12-30T04:00:00'
          pickup_location: LHR
          dropoff_date: '2020-12-31T04:00:00'
          dropoff_location: LHR
          vehicle_sipp_code: MBMR
        rate_totals:
          rate:
            rate_code: IC
            country_code: GB
        customer:
          contact:
            title: MR
            first_name: BRADLEY
            last_name: STEPHEN
            telephone: '123456789900000'
            email: BRADLEY.STEPHEN@abgservices.com
            age: 28
            date_of_birth: '1991-12-31'
          address:
            address_line_1: 696 Block A
            address_line_2: Ellis St
            address_line_3: ''
            city: San Francisco
            postal_code: '94110'
            country_code: GB
        insurance:
        - code: PEP
        - code: ALI
        extras:
        - code: GPS
          quantity: 1
        - code: CSS
          quantity: 1
        payment_preference:
          type: Voucher
          id: '12313434'
          fixed_value: FixedValue
          electronic_indicator: true
          amount: 183.34
          currency: GBP
