    terms_and_conditions_v2_response:
      title: Terms and Conditions Response
      description: The following demonstrates an example of successful request for this endpoint.
      required:
      - status
      - transaction
      - locations
      - terms
      type: object
      properties:
        status:
          $ref: '#/components/schemas/success_status'
        transaction:
          $ref: '#/components/schemas/transaction'
        terms:
          $ref: '#/components/schemas/terms_term'
      example:
        status:
          request_time: '2018-10-25T12:01:54Z'
          success:
          - code: '200'
            message: Success
            details: The location terms and condition was successfully retrieved.
        transaction:
          transaction_id: '12313'
        terms:
        - header: Optional Coverages
          content_type: text/html
          content: <div class=helpCMS>    <a name=Optional Coverages id=Optional Coverages></a><b>Optional Coverages</b><br/>         <p
            align=left><font size=1>Acceptance of the Loss Damage Waiver relieves the renter and authorized additional drivers
            of responsibility for loss of, or damage to the Avis car, when they comply with the terms and conditions listed
            on the rental document jacket. At the time of rental, the customer must initial whether he/she accepts or declines
            the LDW and optional services. LDW and optional services must be signed for at the rental counter.<br />\nLDW
            is taxable.</font></p>\n<p align=left><font size=1>If LDW is not accepted, the customer is financially responsible
            for the full value of:</font></p>\n<ul>\n    <li><font size=1>Accident damage </font></li>\n    <li><font size=1>Glass
            damage </font></li>\n    <li><font size=1>Stolen items (radio, battery, etc.) </font></li>\n    <li><font size=1>Vandalism
            </font></li>\n    <li><font size=1>Theft of the car </font></li>\n</ul>\n<p><font size=1><strong><u>Exceptions:</u></strong></font></p>\n<p
            align=left><font size=1>In <strong>Wisconsin</strong>, if LDW is not accepted, the renter is liable for all loss
            or damage to the Avis car due to an accident or reckless, wanton behavior.</font></p>\n<p align=left><font size=1>In
            <strong>Illinois</strong>, if LDW is not accepted, the customer is financially responsible for the following types
            of damage, up to a maximum of $16,000.00 for rentals :</font></p>\n<ul>\n    <li><font size=1>Accident damage
            </font></li>\n    <li><font size=1>Glass damage </font></li>\n    <li><font size=1>Stolen items (radio, battery,
            etc.) </font></li>\n    <li><font size=1>Vandalism </font></li>\n    <li><font size=1>Theft of the car </font></li>\n</ul>\n<p
            align=left><font size=1><strong>Canceling LDW</strong><br />\nOnce LDW has been purchased, it must remain on the
            contract. The customer has the option to return the car & close the rental agreement; however, this could change
            the rate for the rental agreement and a different, possibly higher, rate could apply for a new rental.</font></p>\n<p
            align=left><font size=1><strong><u>Exceptions:</u></strong><br />\nCustomers who rent in<strong> New York</strong>
            and purchase LDW in New York can decide to cancel this service at no charge, within specific guidelines:</font></p>\n<ul>\n    <li><font
            size=1>Rental must be 2 days or more. </font></li>\n    <li><font size=1>The cancellation must be within the first
            24 hours of the rental. </font></li>\n    <li><font size=1>The actual renter must take the car to an Avis location
            for inspection & must sign a cancellation notice. </font></li>\n</ul>\n<p align=left><font size=1><strong>Loss
            of Use</strong><br />\nThe customer may also be responsible for reimbursing Avis for the revenue lost by not being
            able to use the car while it is being repaired or not recovered due to theft (referred to as Loss of Use).</font></p>\n<p
            align=left><strong><font size=1>Global insurance coverages are always subject to change. Please verify at time
            of rental.</font></strong></p> </div><div align=right><a href=#top><img src=/car-rental/images/global/en/common/backto_top.gif
            width=16 height=10 border=0></a><b>Top</b></div><br/>
        - header: Credit Card Policies
          content_type: text/html
          content: '<div class=helpCMS>      <a name=Credit Card Policies id=Credit Card Policies></a><b>Credit Card Policies</b><br/>        <p><font
            size=2>Avis accepts most major credit cards as credit identification at the time of rental.Â  The renters name
            must be on the credit card.Â  NOTE: Specialty or Signature Series Vehicles - 2 CREDIT CARDS in the renters name
            are required to rent ALL Specialty or Signature Series Vehicles.<br />\r\nAccepted credit card list:Â  Avis Charge
            Card, American Express, AT&T Capital, Diner''s Club Int''l, Discover, China UnionPay, GE Capital, JCB, MasterCard,
            PHH, Sears and Visa.<br />\r\nSome locations may not accept each of the referenced cards.</font><br />\r\nAt the
            time of rental, we will request an authorization on your charge card for the estimated rental charges.Â  While
            this hold is in place, the funds will not be available for your use.Â  When the rental is over, we will process
            the reversal, but the bank may take time to post it back to the account.</p>  </div><div align=right><a href=#top><img
            src=/car-rental/images/global/en/common/backto_top.gif width=16 height=10 border=0></a><b>Top</b></div><br/>'
        - header: Debit Card Policies
          content_type: text/html
          content: <div class=helpCMS>     <a name=Debit Card Policies id=Debit Card Policies></a><b>Debit Card Policies</b><br/>       <p><font
            size=2>This location does accept bank debit cards with the MasterCard or Visa logo at the time of rental if you
            have arrived by air into the metro area. The renter <strong>must</strong> present a return airline ticket with
            a return date at the time of rental.Â  The renter must be at least 25 years of age. You will be subject to a credit
            check to determine and ensure credit worthiness before releasing the car to you.</font></p>\r\n<p><font size=2>Currently,
            at all U.S. and Canada locations, debit cards are not acceptable as credit identification at the time of rental
            for all makes and models identified in the <strong>Specialty</strong> or <strong><a href=https://www.avis.com/car-rental/content/display.ac?contentId=avis-signature-US_en-042413&MID=sigvan><font
            color=#0000ff>Avis Signature Series</font></a> </strong>and <strong>for certain other premium vehicles</strong>.</font></p>\r\n<p><font
            size=2>Avis will generally request an authorization hold against your account for the estimated charges of the
            rental but reserves the right, in its sole discretion, to request extra value based on certain factors as we deem
            appropriate. <strong>THESE FUNDS WILL NOT BE AVAILABLE FOR YOUR USE.</strong> When the rental is over we will
            process the reversal but the bank may take time to post it back to the account.</font></p>\r\n<p><font size=2>If
            you fail to return the vehicle as agreed, Avis will obtain additional authorizations from your account to cover
            the rental charges.</font></p>\r\n<p><font size=2>Avis is not responsible for any returned checks or over-drafts
            based on this policy.</font></p>\r\n<p><font size=2>Positive identification in addition to your driver's license
            may be required.</font></p>\r\n<p><font size=2>In the United States, Debit or Check cards can be used at the end
            for payment of rental charges. For acceptable credit identification and payment methods in countries outside of
            the United States, please consult the Renter's Guide and search for the specific location.</font></p>\r\n<p><font
            size=2><strong>Note:</strong> Prepaid Debit/Gift cards are not acceptable methods of credit identification to
            pick up a car at any location. One of the above mentioned cards must be presented. Prepaid Debit/Gift cards are
            accepted at time of return only.</font></p> </div><div align=right><a href=#top><img src=/car-rental/images/global/en/common/backto_top.gif
            width=16 height=10 border=0></a><b>Top</b></div><br/>
    totals:
      title: Reservation Totals
      description: The total reservation rate, taxes and fees for the entirety of the reservation.
      type: object
