                    JCB, MasterCard, PHH, Sears and Visa.Some locations may not accept each of the referenced cards.At the
                    time of rental, we will request an authorization on your charge card for the estimated rental charges.Â 
                    While this hold is in place, the funds will not be available for your use.Â  When the rental is over,
                    we will process the reversal, but the bank may take time to post it back to the account.'
                - header: Debit Card Policies
                  content_type: text/plain
                  content: This location does accept bank debit cards with the MasterCard or Visa logo at the time of rental
                    if you have arrived by air into the metro area. The renter <strong>must</strong> present a return airline
                    ticket with a return date at the time of rental.Â  The renter must be at least 25 years of age. You will
                    be subject to a credit check to determine and ensure credit worthiness before releasing the car to you.Currently,
                    at all U.S. and Canada locations, debit cards are not acceptable as credit identification at the time
                    of rental for all makes and models identified in the Avis will generally request an authorization hold
                    against your account for the estimated charges of the rental but reserves the right, in its sole discretion,
                    to request extra value based on certain factors as we deem appropriate. <strong>THESE FUNDS WILL NOT BE
                    AVAILABLE FOR YOUR USE. When the rental is over we will process the reversal but the bank may take time
                    to post it back to the account.If you fail to return the vehicle as agreed, Avis will obtain additional
                    authorizations from your account to cover the rental charges.Avis is not responsible for any returned
                    checks or over-drafts based on this policy.Positive identification in addition to your driver's license
                    may be required.In the United States, Debit or Check cards can be used at the end for payment of rental
                    charges. For acceptable credit identification and payment methods in countries outside of the United States,
                    please consult the Renter's Guide and search for the specific location.Prepaid Debit/Gift cards are not
                    acceptable methods of credit identification to pick up a car at any location. One of the above mentioned
                    cards must be presented. Prepaid Debit/Gift cards are accepted at time of return only.
        '400':
