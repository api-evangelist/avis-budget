      description: Customer type representing the Customer or Driver. Used primarily for the delivery and collection.
      enum:
      - CUSTOMER
      - DRIVER
      type: string
      example: CUSTOMER
    date:
      title: Date
      format: date
      description: ISO 8601 representation of the date.
      type: string
      example: '2015-05-23'
    date_time:
      title: Date Time
      format: date-time
      description: ISO 8601 representation of the date time.
      type: string
      example: '2015-07-04T21:00:00.000Z'
    disclaimer:
      title: Disclaimer
      description: This contains the addtional information
      required:
      - description
      type: object
      properties:
        type:
          title: Disclaimer Name
          description: Disclaimer name
          type: string
        description:
          title: Disclaimer Comment
          description: Disclaimer comment
          type: string
    discount:
      title: Brand Discounts
      description: The rental vehicle brand rewards program code (also known as discount code) to be applied to the rate of
        the reservation.
      type: object
      properties:
        code:
          $ref: '#/components/schemas/discount_code'
      example: R566100
    discount_code:
      title: Discount Code
      description: The rental vehicle brand discount code. This field can be an Avis Worldwide Discount (AWD), Budget Car
        Discount (BCD), or a Payless Discount Number (PDN) code.
      type: string
      example: R566100
    distance:
      title: Reservation Distance Limitations
      description: Information about rental vehicle reservation distance options and limitations. If a reservation includes
        limited distance, then the distance covered is returned in distance_covered and the rate if the distance is exceeded
        is returned in distance_overage.
      required:
      - unlimited_distance
      - distance_unit
      type: object
      properties:
        unlimited_distance:
          description: Indicates whether the reservation distance is unlimited.
          type: boolean
          example: true
        distance_covered:
          description: The free distance covered for the duration of the rental period.
          type: number
          example: 500
        distance_unit:
          description: The unit of distance.
          type: string
          example: miles
        distance_overage:
          description: The cost per distance unit if the free distance in distance_covered is exceeded.
          type: number
          example: 0.15
    driver:
      title: Driver License
      description: The driver license information of the user, including license number, issuing country, and date of birth.
      type: object
      properties:
        license_number:
          description: Driver license number.
          type: string
        state_code:
          description: 2-letter state code. For US country, valid combination of country and state code. For non-US country,
            XX is valid value.
          type: string
          example: TX
        country_code:
          description: 2-letter ISO 3166 country code.
          maxLength: 2
          minLength: 2
          type: string
          example: GB
        license_verified:
          description: Indicates the authenticity of the passenger's driving license.
          type: boolean
