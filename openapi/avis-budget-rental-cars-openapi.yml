      type: object
      properties:
        code:
          description: The coupon code to be applied to the reservation rate.
          type: string
          example: MUZZ014
        type:
          $ref: '#/components/schemas/coupon_type'
        quantity:
          title: Quantity
          description: The number of coupon codes to apply to the reservation.
          type: number
          example: 1
        coupon_applied:
          title: Coupon Applied Flag
          description: Indicates that a coupon code is valid and was successfully applied for the reservation.
          type: boolean
          example: false
        coupon_amount:
          description: The amount of the coupon discount applied to the cost of the reservation.
          type: number
          example: 0
        secondary_coupon_amount:
          description: The secondary amount of the coupon discount applied to the cost of the reservation.
          type: number
          example: 0
        coupon_extras:
          $ref: '#/components/schemas/extras'
        description:
          description: Description of the coupon code that was specified in the request.
          type: string
      example:
        code: some text
        type: Upgrade
        quantity: 13.21
        coupon_applied: true
        coupon_amount: 90.01
        coupon_extras:
