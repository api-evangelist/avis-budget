- name: Avis Budget Group Rental Cars API
  description: 'REST API (v2) for the Avis, Budget and Payless rental car brands: keyword search of rental locations, vehicle
    availability and rate shopping (including inclusive rates, coupons, memberships and secondary-currency pricing), reservation
    create, view, update, partial-modify and cancel (including paperless-voucher processing), and location terms and conditions.
