description: 'Avis Budget Group (NASDAQ: CAR) is a global provider of vehicle rental and mobility solutions operating the
  Avis, Budget, Budget Truck, Payless and Zipcar brands across roughly 11,000 rental locations in about 180 countries. The
  Avis Budget Group Developer Portal (developer.avis.com, a Kong-hosted portal) publishes the Rental Cars 2.0.0 REST API —
  location keyword search, vehicle availability and rate shopping, reservation create/view/modify/cancel, and location-specific
  terms and conditions — for travel, airline, OTA and partner applications, secured with OAuth 2.0 client credentials and
  gated behind partner sign-up and ABG approval. A white-label car rental booking solution is offered alongside the API.'
