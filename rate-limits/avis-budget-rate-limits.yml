summary: >-
  ABG's own public Postman documentation for the Reservation APIs states verbatim: "Currently we do not have any
  rate limiting in place. This may change at our discretion." The developer-portal API Design Guide reserves
  HTTP 429 with reason "throttled" ("Rate limit exceeded") in its status-code mapping, and the OpenAPI declares
  no 429 response and no rate-limit headers on any operation. So: a documented 429 semantics with a documented
  zero enforcement — limit_count is an honest 0, not an unknown.
